<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wish Fountain</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Three.js & Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Stripe SDK -->
    <script src="https://js.stripe.com/v3/"></script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Βάλτε τα δικά σας στοιχεία Firebase
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.firebaseApp = { 
            auth, db, provider, signInWithPopup, 
            createUserWithEmailAndPassword, signInWithEmailAndPassword, 
            signOut, onAuthStateChanged, collection, addDoc, onSnapshot, serverTimestamp 
        };
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #050508; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .top-bar { position: absolute; top: 20px; width: 100%; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .badge { background: rgba(10, 15, 25, 0.7); border: 1px solid rgba(0, 243, 255, 0.4); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); padding: 8px 18px; border-radius: 20px; font-size: 0.95rem; color: #ffcc00; font-weight: 600; backdrop-filter: blur(8px); }
        .top-right-controls { display: flex; gap: 12px; }

        .btn-neon { background: rgba(15, 12, 5, 0.8); border: 1px solid #ffaa00; color: #ffaa00; padding: 8px 18px; border-radius: 20px; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 0 10px rgba(255, 170, 0, 0.2); backdrop-filter: blur(8px); }
        .btn-neon:hover { background: #ffaa00; color: #000; box-shadow: 0 0 20px rgba(255, 170, 0, 0.6); }

        .prompt-title { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(10, 15, 25, 0.6); border: 1px solid rgba(0, 243, 255, 0.2); padding: 8px 22px; border-radius: 25px; color: #8fa0be; font-style: italic; letter-spacing: 1px; backdrop-filter: blur(5px); pointer-events: none; font-size: 0.95rem; }

        .bottom-bar { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 550px; background: rgba(8, 12, 20, 0.85); border: 1px solid rgba(0, 243, 255, 0.5); box-shadow: 0 0 25px rgba(0, 243, 255, 0.3); border-radius: 30px; padding: 6px 8px; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(10px); z-index: 10; }
        .bottom-bar input[type="text"] { flex: 1; min-width: 0; background: transparent; border: none; padding: 8px 12px; color: #fff; font-size: 0.95rem; outline: none; }
        .checkbox-container { display: flex; align-items: center; gap: 4px; font-size: 0.8rem; color: #00f3ff; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .btn-throw { background: linear-gradient(90deg, #ff9900, #ffbb00); border: none; color: #000; font-weight: bold; padding: 10px 18px; border-radius: 22px; cursor: pointer; box-shadow: 0 0 15px rgba(255, 153, 0, 0.5); transition: 0.3s; white-space: nowrap; flex-shrink: 0; font-size: 0.9rem; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #0d1322; border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: 0 0 30px rgba(0, 243, 255, 0.2); padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; position: relative; text-align: center; }
        .close-btn { position: absolute; top: 12px; right: 18px; color: #aaa; font-size: 1.5rem; cursor: pointer; }

        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.8rem; color: #8fa0be; }
        .form-group input { width: 100%; padding: 10px; background: #050811; border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 8px; color: #fff; outline: none; font-size: 0.9rem; }
        .form-group input:focus { border-color: #00f3ff; }

        .btn-submit-modal { width: 100%; padding: 10px; background: linear-gradient(90deg, #00f3ff, #0077ff); border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-google { width: 100%; padding: 10px; background: #4285f4; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-google:hover { background: #357ae8; }

        .toggle-auth { color: #00f3ff; font-size: 0.8rem; cursor: pointer; margin-top: 10px; display: inline-block; text-decoration: underline; }
        .error-msg { color: #ff4757; font-size: 0.75rem; margin-top: 5px; display: none; text-align: left; }

        .divider { display: flex; align-items: center; margin: 15px 0; color: #6a7b95; font-size: 0.75rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(0, 243, 255, 0.2); }
        .divider span { padding: 0 8px; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="top-bar">
        <div class="badge" id="wishesCountBadge">✨ Wishes: 0</div>
        <div class="top-right-controls">
            <button class="btn-neon" id="aboutBtn">✨ About</button>
            <button class="btn-neon" id="authBtn">🔑 Login / Sign Up</button>
        </div>
    </div>

    <div class="prompt-title">Make your wish come true... ✨</div>

    <form class="bottom-bar" id="wishForm">
        <input type="text" id="wishInput" placeholder="Make a wish..." required autocomplete="off">
        <label class="checkbox-container">
            <input type="checkbox" id="publicCheck" checked> Public
        </label>
        <button type="submit" class="btn-throw" id="submitWishBtn">Throw (1€)</button>
    </form>

    <!-- Modal Αυθεντικοποίησης (Email/Pass & Google) -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="close-btn" id="closeAuthModal">&times;</span>
            <h2 style="margin-bottom: 15px; color: #00f3ff;" id="modalTitle">Login</h2>
            
            <form id="emailAuthForm">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label>Όνομα</label>
                    <input type="text" id="authName" placeholder="Το όνομά σας">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="authEmail" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label>Κωδικός</label>
                    <input type="password" id="authPassword" placeholder="******" required>
                    <div class="error-msg" id="passwordError">Ο κωδικός πρέπει να έχει τουλάχιστον 7 χαρακτήρες και 1 κεφαλαίο γράμμα.</div>
                </div>
                <button type="submit" class="btn-submit-modal" id="authSubmitBtn">Σύνδεση</button>
            </form>

            <span class="toggle-auth" id="toggleAuthMode">Δεν έχετε λογαριασμό; Εγγραφή</span>

            <div class="divider"><span>Ή</span></div>

            <button class="btn-google" id="googleLoginBtn">Sign in with Google</button>
            <div class="error-msg" id="authGeneralError" style="text-align: center; margin-top: 8px;"></div>
        </div>
    </div>

    <script>
        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050508, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2.1;

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const fountainGroup = new THREE.Group();
        const darkMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.2 });
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x0088aa, roughness: 0.1, transparent: true, opacity: 0.9 });

        const base = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 3, 0.4, 32), darkMat);
        base.position.y = -1;
        fountainGroup.add(base);

        const water = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.4, 0.1, 32), waterMat);
        water.position.y = -0.8;
        fountainGroup.add(water);

        const bowl = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 0.8, 0.3, 32), darkMat);
        bowl.position.y = 0.4;
        fountainGroup.add(bowl);

        scene.add(fountainGroup);

        const coinsGroup = new THREE.Group();
        fountainGroup.add(coinsGroup);
        const coinGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.02, 16);
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.2 });

        function addCoinToFountain() {
            const coin = new THREE.Mesh(coinGeo, coinMat);
            const radius = Math.random() * 0.8;
            const angle = Math.random() * Math.PI * 2;
            coin.position.set(Math.cos(angle) * radius, 0.56, Math.sin(angle) * radius);
            coin.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.2;
            coinsGroup.add(coin);
        }

        function animate() {
            requestAnimationFrame(animate);
            fountainGroup.rotation.y += 0.002;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- AUTH & STRIPE INTEGRATION ---
        let isSignUpMode = false;
        const stripe = Stripe('YOUR_STRIPE_PUBLIC_KEY'); // Προσθέστε το δικό σας Stripe Key

        window.addEventListener('load', () => {
            const interval = setInterval(() => {
                if (window.firebaseApp) {
                    clearInterval(interval);
                    initApp();
                }
            }, 100);
        });

        function initApp() {
            const { 
                auth, db, provider, signInWithPopup, 
                createUserWithEmailAndPassword, signInWithEmailAndPassword, 
                signOut, onAuthStateChanged, collection, addDoc, onSnapshot, serverTimestamp 
            } = window.firebaseApp;

            let currentUser = null;

            // Παρακολούθηση Κατάστασης Χρήστη
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                const authBtn = document.getElementById('authBtn');
                if (user) {
                    authBtn.innerText = `👤 ${user.displayName || user.email.split('@')[0]}`;
                } else {
                    authBtn.innerText = '🔑 Login / Sign Up';
                }
            });

            // Toggle Login / Sign Up
            const toggleBtn = document.getElementById('toggleAuthMode');
            const modalTitle = document.getElementById('modalTitle');
            const authSubmitBtn = document.getElementById('authSubmitBtn');
            const nameGroup = document.getElementById('nameGroup');

            toggleBtn.onclick = () => {
                isSignUpMode = !isSignUpMode;
                if (isSignUpMode) {
                    modalTitle.innerText = "Εγγραφή";
                    authSubmitBtn.innerText = "Δημιουργία Λογαριασμού";
                    toggleBtn.innerText = "Έχετε ήδη λογαριασμό; Σύνδεση";
                    nameGroup.style.display = "block";
                } else {
                    modalTitle.innerText = "Σύνδεση";
                    authSubmitBtn.innerText = "Σύνδεση";
                    toggleBtn.innerText = "Δεν έχετε λογαριασμό; Εγγραφή";
                    nameGroup.style.display = "none";
                }
            };

            // Email / Password Form Submit
            document.getElementById('emailAuthForm').onsubmit = async (e) => {
                e.preventDefault();
                const email = document.getElementById('authEmail').value;
                const password = document.getElementById('authPassword').value;
                const passErr = document.getElementById('passwordError');
                const genErr = document.getElementById('authGeneralError');
                
                passErr.style.display = 'none';
                genErr.style.display = 'none';

                // Validation Κωδικού (7+ χαρακτήρες, 1 κεφαλαίο)
                const passRegex = /^(?=.*[A-Z]).{7,}$/;

                if (isSignUpMode) {
                    if (!passRegex.test(password)) {
                        passErr.style.display = 'block';
                        return;
                    }
                    try {
                        await createUserWithEmailAndPassword(auth, email, password);
                        document.getElementById('authModal').style.display = 'none';
                    } catch (err) {
                        genErr.innerText = err.message;
                        genErr.style.display = 'block';
                    }
                } else {
                    try {
                        await signInWithEmailAndPassword(auth, email, password);
                        document.getElementById('authModal').style.display = 'none';
                    } catch (err) {
                        genErr.innerText = "Λάθος στοιχεία σύνδεσης.";
                        genErr.style.display = 'block';
                    }
                }
            };

            // Google Login
            document.getElementById('googleLoginBtn').onclick = async () => {
                const genErr = document.getElementById('authGeneralError');
                genErr.style.display = 'none';
                try {
                    await signInWithPopup(auth, provider);
                    document.getElementById('authModal').style.display = 'none';
                } catch (err) {
                    console.error("Google Auth Error:", err);
                    genErr.innerText = "Σφάλμα Google Sign-In. Βεβαιωθείτε ότι το domain έχει προστεθεί στο Firebase Console.";
                    genErr.style.display = 'block';
                }
            };

            // Realtime Wishes Counter & Coins
            onSnapshot(collection(db, "wishes"), (snapshot) => {
                document.getElementById('wishesCountBadge').innerText = `✨ Wishes: ${snapshot.size}`;
                while(coinsGroup.children.length > 0){ coinsGroup.remove(coinsGroup.children[0]); }
                snapshot.forEach(() => addCoinToFountain());
            });

            // Stripe Checkout Integration
            document.getElementById('wishForm').onsubmit = async (e) => {
                e.preventDefault();
                const input = document.getElementById('wishInput');
                if (!input.value.trim()) return;

                // Αποθήκευση της ευχής προσωρινά ή αποστολή στο Backend για Stripe Checkout Session
                try {
                    // Παράδειγμα κλήσης Backend για δημιουργία Checkout Session
                    const response = await fetch('/create-checkout-session', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ wishText: input.value })
                    });
                    const session = await response.json();
                    
                    if(session.id) {
                        await stripe.redirectToCheckout({ sessionId: session.id });
                    } else {
                        // Αν δεν υπάρχει backend έτοιμο, καταχωρείται απευθείας στη βάση
                        await addDoc(collection(db, "wishes"), {
                            text: input.value,
                            isPublic: document.getElementById('publicCheck').checked,
                            author: currentUser ? (currentUser.displayName || currentUser.email) : "Anonymous",
                            createdAt: serverTimestamp()
                        });
                        input.value = "";
                    }
                } catch (err) {
                    console.error("Payment / Firestore Error:", err);
                }
            };
        }

        // Modal Controls
        const authModal = document.getElementById('authModal');
        document.getElementById('authBtn').onclick = () => {
            if (window.firebaseApp && window.firebaseApp.auth.currentUser) {
                if (confirm("Θέλετε να αποσυνδεθείτε;")) window.firebaseApp.signOut(window.firebaseApp.auth);
            } else {
                authModal.style.display = 'flex';
            }
        };
        document.getElementById('closeAuthModal').onclick = () => authModal.style.display = 'none';
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wish Fountain</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Three.js & Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration (Αντικατάστησε με τα δικά σου keys)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.firebaseApp = { auth, db, provider, signInWithPopup, signOut, onAuthStateChanged, collection, addDoc, onSnapshot, serverTimestamp };
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            background-color: #050508;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .top-bar {
            position: absolute;
            top: 20px;
            width: 100%;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .badge {
            background: rgba(10, 15, 25, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            color: #ffcc00;
            font-weight: 600;
            backdrop-filter: blur(8px);
        }

        .top-right-controls {
            display: flex;
            gap: 12px;
        }

        .btn-neon {
            background: rgba(15, 12, 5, 0.8);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.2);
            backdrop-filter: blur(8px);
        }

        .btn-neon:hover {
            background: #ffaa00;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.6);
        }

        .prompt-title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(10, 15, 25, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 8px 22px;
            border-radius: 25px;
            color: #8fa0be;
            font-style: italic;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            pointer-events: none;
            font-size: 0.95rem;
        }

        .bottom-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 550px;
            background: rgba(8, 12, 20, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
            border-radius: 30px;
            padding: 6px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            z-index: 10;
            overflow: hidden;
        }

        .bottom-bar input[type="text"] {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .bottom-bar input::placeholder { color: #6a7b95; }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            color: #00f3ff;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-throw {
            background: linear-gradient(90deg, #ff9900, #ffbb00);
            border: none;
            color: #000;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 22px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.5);
            transition: 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .btn-throw:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.8);
        }

        #coinTooltip {
            position: absolute;
            display: none;
            background: rgba(10, 15, 28, 0.95);
            border: 1px solid #00f3ff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            padding: 12px 16px;
            border-radius: 12px;
            color: #fff;
            z-index: 50;
            pointer-events: auto;
            max-width: 260px;
            backdrop-filter: blur(8px);
            transform: translate(-50%, -100%);
        }

        #coinTooltip .wish-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        #coinTooltip .wish-author {
            font-size: 0.75rem;
            color: #8fa0be;
            margin-bottom: 8px;
        }

        .tooltip-btn {
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .tooltip-btn.delete {
            border-color: #ff4757;
            color: #ff4757;
            background: rgba(255, 71, 87, 0.15);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #0d1322;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
            position: relative;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 12px; right: 18px;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #8fa0be; }
        .form-group input {
            width: 100%; padding: 10px; background: #050811;
            border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 8px; color: #fff; outline: none;
        }
        .form-group input:focus { border-color: #00f3ff; }

        .btn-submit-modal {
            width: 100%; padding: 12px;
            background: linear-gradient(90deg, #00f3ff, #0077ff);
            border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer;
        }

        .btn-google {
            width: 100%; padding: 12px; background: #4285f4; border: none; border-radius: 8px;
            color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-google:hover { background: #357ae8; }

        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: #6a7b95;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: rgba(0, 243, 255, 0.2);
        }
        .divider span { padding: 0 10px; }

        @media (max-width: 600px) {
            .top-bar { padding: 10px 15px; gap: 8px; }
            .badge { padding: 5px 10px; font-size: 0.75rem; }
            .btn-neon { padding: 6px 12px; font-size: 0.75rem; }
            .top-right-controls { gap: 6px; }
            .prompt-title { top: 65px; font-size: 0.75rem; padding: 5px 14px; width: 85%; text-align: center; }
            .bottom-bar { bottom: 15px; width: 95%; padding: 4px 6px; gap: 4px; }
            .bottom-bar input[type="text"] { padding: 6px 8px; font-size: 0.8rem; }
            .checkbox-container { font-size: 0.7rem; margin: 0 2px; }
            .btn-throw { padding: 8px 12px; font-size: 0.75rem; border-radius: 18px; }
            .modal-content { width: 95%; padding: 20px 15px; }
            #coinTooltip { max-width: 200px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="top-bar">
        <div class="badge" id="wishesCountBadge">✨ Wishes: 0</div>
        <div class="top-right-controls">
            <button class="btn-neon" id="aboutBtn">✨ About</button>
            <button class="btn-neon" id="authBtn">🔑 Login / Sign Up</button>
        </div>
    </div>

    <div class="prompt-title">Make your wish come true... ✨</div>

    <form class="bottom-bar" id="wishForm">
        <input type="text" id="wishInput" placeholder="Make a wish..." required autocomplete="off">
        <label class="checkbox-container">
            <input type="checkbox" id="publicCheck" checked> Public
        </label>
        <button type="submit" class="btn-throw" id="submitWishBtn">Throw (1€)</button>
    </form>

    <div id="coinTooltip">
        <div class="wish-text" id="tooltipText">Wish text goes here</div>
        <div class="wish-author" id="tooltipAuthor">by Anonymous</div>
        <div class="actions">
            <button class="tooltip-btn delete" id="tooltipDeleteBtn" style="display:none;">Delete</button>
        </div>
    </div>

    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="close-btn" id="closeAuthModal">&times;</span>
            <h2 style="margin-bottom: 20px; color: #00f3ff;" id="modalTitle">Account</h2>
            <button class="btn-google" id="googleLoginBtn">Sign in with Google</button>
        </div>
    </div>

    <div class="modal" id="aboutModal">
        <div class="modal-content">
            <span class="close-btn" id="closeAboutModal">&times;</span>
            <h2 style="margin-bottom: 15px; color: #ffaa00;">About Wish Fountain</h2>
            <p style="color: #8fa0be; font-size: 0.9rem; line-height: 1.5;">
                Throw a coin into the digital fountain and make a wish. Your wish will be stored forever in the digital realm.
            </p>
        </div>
    </div>

    <script>
        // --- THREE.JS SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050508, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2.1;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);
        const cyanLight = new THREE.PointLight(0x00f3ff, 3, 12);
        cyanLight.position.set(0, 2, 0);
        scene.add(cyanLight);

        // Fountain Mesh
        const fountainGroup = new THREE.Group();
        const darkMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.2 });
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x0088aa, roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.9 });

        const base = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 3, 0.4, 32), darkMat);
        base.position.y = -1;
        fountainGroup.add(base);

        const water = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.4, 0.1, 32), waterMat);
        water.position.y = -0.8;
        fountainGroup.add(water);

        const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1.2, 16), darkMat);
        pedestal.position.y = -0.2;
        fountainGroup.add(pedestal);

        const bowl = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 0.8, 0.3, 32), darkMat);
        bowl.position.y = 0.4;
        fountainGroup.add(bowl);

        const topWater = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 0.05, 32), waterMat);
        topWater.position.y = 0.53;
        fountainGroup.add(topWater);

        scene.add(fountainGroup);

        // Water Particles
        const particleCount = 250;
        const particlesGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = 0; positions[i * 3 + 1] = 0.55; positions[i * 3 + 2] = 0;
            velocities.push({ x: (Math.random() - 0.5) * 0.03, y: Math.random() * 0.05 + 0.04, z: (Math.random() - 0.5) * 0.03 });
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleSystem = new THREE.Points(particlesGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.06, transparent: true, opacity: 0.9 }));
        scene.add(particleSystem);

        // --- 3D COIN GENERATION ---
        const coinsGroup = new THREE.Group();
        fountainGroup.add(coinsGroup);

        const coinGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.02, 16);
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.2 });

        function addCoinToFountain() {
            const coin = new THREE.Mesh(coinGeo, coinMat);
            const radius = Math.random() * 0.8;
            const angle = Math.random() * Math.PI * 2;
            
            coin.position.x = Math.cos(angle) * radius;
            coin.position.y = 0.56;
            coin.position.z = Math.sin(angle) * radius;
            coin.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.2;
            coin.rotation.z = Math.random() * Math.PI;

            coinsGroup.add(coin);
        }

        function animate() {
            requestAnimationFrame(animate);
            const pos = particleSystem.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                pos[i * 3] += velocities[i].x; pos[i * 3 + 1] += velocities[i].y; pos[i * 3 + 2] += velocities[i].z;
                velocities[i].y -= 0.0018;
                if (pos[i * 3 + 1] < 0.5) {
                    pos[i * 3] = 0; pos[i * 3 + 1] = 0.55; pos[i * 3 + 2] = 0;
                    velocities[i].x = (Math.random() - 0.5) * 0.03; velocities[i].y = Math.random() * 0.04 + 0.035; velocities[i].z = (Math.random() - 0.5) * 0.03;
                }
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
            fountainGroup.rotation.y += 0.002;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- FIREBASE LOGIC ---
        window.addEventListener('load', () => {
            const interval = setInterval(() => {
                if (window.firebaseApp) {
                    clearInterval(interval);
                    initFirebaseLogic();
                }
            }, 100);
        });

        function initFirebaseLogic() {
            const { auth, db, provider, signInWithPopup, signOut, onAuthStateChanged, collection, addDoc, onSnapshot, serverTimestamp } = window.firebaseApp;
            let currentUser = null;

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                const authBtn = document.getElementById('authBtn');
                if (user) {
                    authBtn.innerText = `👤 ${user.displayName ? user.displayName.split(' ')[0] : 'User'}`;
                } else {
                    authBtn.innerText = '🔑 Login / Sign Up';
                }
            });

            document.getElementById('googleLoginBtn').onclick = async () => {
                try {
                    await signInWithPopup(auth, provider);
                    document.getElementById('authModal').style.display = 'none';
                } catch (err) {
                    console.error("Auth Error:", err);
                }
            };

            onSnapshot(collection(db, "wishes"), (snapshot) => {
                document.getElementById('wishesCountBadge').innerText = `✨ Wishes: ${snapshot.size}`;
                while(coinsGroup.children.length > 0){ coinsGroup.remove(coinsGroup.children[0]); }
                snapshot.forEach(() => addCoinToFountain());
            });

            document.getElementById('wishForm').onsubmit = async (e) => {
                e.preventDefault();
                const input = document.getElementById('wishInput');
                const isPublic = document.getElementById('publicCheck').checked;

                if (!input.value.trim()) return;

                try {
                    await addDoc(collection(db, "wishes"), {
                        text: input.value,
                        isPublic: isPublic,
                        author: currentUser ? (currentUser.displayName || "Anonymous") : "Anonymous",
                        userId: currentUser ? currentUser.uid : null,
                        createdAt: serverTimestamp()
                    });
                    input.value = "";
                } catch (err) {
                    console.error("Firestore Error:", err);
                }
            };
        }

        // Modals Toggle
        const authModal = document.getElementById('authModal');
        const aboutModal = document.getElementById('aboutModal');

        document.getElementById('authBtn').onclick = () => {
            if (window.firebaseApp && window.firebaseApp.auth.currentUser) {
                if (confirm("Θέλετε να αποσυνδεθείτε;")) window.firebaseApp.signOut(window.firebaseApp.auth);
            } else {
                authModal.style.display = 'flex';
            }
        };
        document.getElementById('aboutBtn').onclick = () => aboutModal.style.display = 'flex';
        document.getElementById('closeAuthModal').onclick = () => authModal.style.display = 'none';
        document.getElementById('closeAboutModal').onclick = () => aboutModal.style.display = 'none';
    </script>
</body>
</html>

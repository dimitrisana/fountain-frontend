<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wish Fountain - Ψηφιακό Σιντριβάνι Ευχών</title>
    
    <!-- CSS / Fonts / Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #ffd700;
            --dark-bg: #0a0e17;
            --panel-bg: rgba(16, 24, 39, 0.85);
            --neon-blue: #00f3ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .interactive {
            pointer-events: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-container {
            display: flex;
            gap: 20px;
            font-size: 16px;
        }

        .stat-box {
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-value {
            color: var(--primary-gold);
            font-weight: bold;
        }

        .user-controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(45deg, #ffd700, #ffa500);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
            box-shadow: none;
        }

        .main-action {
            align-self: center;
            margin-bottom: 30px;
        }

        .btn-wish {
            font-size: 20px;
            padding: 15px 40px;
            border-radius: 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--primary-gold);
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }

        .close-btn:hover { color: #fff; }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-gold);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.5);
            color: #fff;
            outline: none;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .wishes-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .wish-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,215,0,0.2);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .wish-card-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .google-btn {
            background: #4285F4;
            color: white;
            width: 100%;
            margin-top: 10px;
        }
    </style>

    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <header class="interactive">
            <div class="logo">
                <i class="fas fa-coins"></i> Wish Fountain
            </div>
            <div class="stats-container">
                <div class="stat-box">Συνολικές Ευχές: <span id="total-wishes" class="stat-value">0</span></div>
                <div class="stat-box">Νομίσματα: <span id="total-coins" class="stat-value">0</span></div>
            </div>
            <div class="user-controls" id="auth-buttons">
                <button class="btn btn-secondary" onclick="openModal('auth-modal')">Σύνδεση</button>
            </div>
        </header>

        <div class="main-action interactive">
            <button class="btn btn-wish" onclick="handleWishButtonClick()">
                <i class="fas fa-magic"></i> Κάνε μια Ευχή (1€)
            </button>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal interactive">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('auth-modal')">&times;</span>
            <h2 style="margin-bottom: 20px; color: var(--primary-gold);">Είσοδος / Εγγραφή</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="auth-email" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Κωδικός</label>
                <input type="password" id="auth-password" placeholder="******">
            </div>
            <button class="btn" style="width: 100%;" onclick="handleEmailAuth()">Σύνδεση / Εγγραφή</button>
            <button class="btn google-btn" onclick="handleGoogleAuth()">
                <i class="fab fa-google"></i> Σύνδεση με Google
            </button>
        </div>
    </div>

    <!-- Wish Modal -->
    <div id="wish-modal" class="modal interactive">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('wish-modal')">&times;</span>
            <h2 style="margin-bottom: 20px; color: var(--primary-gold);">Γράψε την Ευχή σου</h2>
            <div class="form-group">
                <label>Η Ευχή σου</label>
                <textarea id="wish-text" placeholder="Γράψε εδώ αυτό που εύχεσαι..."></textarea>
            </div>
            <button class="btn" style="width: 100%;" onclick="submitWishAndPay()">
                Ρίξε το Νόμισμα & Πλήρωσε (1€)
            </button>
        </div>
    </div>

    <!-- My Wishes Modal -->
    <div id="my-wishes-modal" class="modal interactive">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('my-wishes-modal')">&times;</span>
            <h2 style="margin-bottom: 20px; color: var(--primary-gold);">Οι Ευχές μου</h2>
            <div class="wishes-list" id="my-wishes-container">
                <!-- Δυναμική φόρτωση ευχών -->
            </div>
        </div>
    </div>

    <!-- App Logic (Firebase + Three.js) -->
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            onSnapshot, 
            collection, 
            query, 
            where, 
            getDocs 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const stripe = Stripe('YOUR_STRIPE_PUBLIC_KEY');

        let currentUser = null;

        // --- Auth Listeners ---
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const authContainer = document.getElementById('auth-buttons');
            if (user) {
                authContainer.innerHTML = `
                    <button class="btn btn-secondary" onclick="openMyWishes()">Οι Ευχές μου</button>
                    <button class="btn btn-secondary" onclick="handleSignOut()">Αποσύνδεση</button>
                `;
            } else {
                authContainer.innerHTML = `
                    <button class="btn btn-secondary" onclick="openModal('auth-modal')">Σύνδεση</button>
                `;
            }
        });

        // Global functions for UI access
        window.handleEmailAuth = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                closeModal('auth-modal');
            } catch (err) {
                try {
                    await createUserWithEmailAndPassword(auth, email, pass);
                    closeModal('auth-modal');
                } catch (createErr) {
                    alert("Σφάλμα αυθεντικοποίησης: " + createErr.message);
                }
            }
        };

        window.handleGoogleAuth = async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                closeModal('auth-modal');
            } catch (err) {
                alert("Σφάλμα σύνδεσης Google: " + err.message);
            }
        };

        window.handleSignOut = () => signOut(auth);

        window.handleWishButtonClick = () => {
            if (!currentUser) {
                openModal('auth-modal');
            } else {
                openModal('wish-modal');
            }
        };

        window.submitWishAndPay = async () => {
            const text = document.getElementById('wish-text').value;
            if (!text) return alert("Παρακαλώ γράψε μια ευχή.");

            try {
                const response = await fetch('https://fountain-backend-mgxf.onrender.com/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        wishText: text,
                        userId: currentUser.uid,
                        userEmail: currentUser.email
                    })
                });
                
                const session = await response.json();
                if (session.url) {
                    window.location.href = session.url;
                } else if (session.id) {
                    await stripe.redirectToCheckout({ sessionId: session.id });
                }
            } catch (err) {
                alert("Σφάλμα κατά την πληρωμή: " + err.message);
            }
        };

        window.openMyWishes = async () => {
            if (!currentUser) return;
            const container = document.getElementById('my-wishes-container');
            container.innerHTML = 'Φόρτωση...';
            openModal('my-wishes-modal');

            const q = query(collection(db, "wishes"), where("userId", "==", currentUser.uid));
            const querySnapshot = await getDocs(q);
            
            container.innerHTML = '';
            if(querySnapshot.empty) {
                container.innerHTML = '<p>Δεν έχεις κάνει ακόμα κάποια ευχή.</p>';
                return;
            }

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = 'wish-card';
                card.innerHTML = `
                    <div class="wish-card-header">
                        <span>${data.createdAt ? new Date(data.createdAt.toDate()).toLocaleDateString('el-GR') : ''}</span>
                    </div>
                    <div>${data.text}</div>
                `;
                container.appendChild(card);
            });
        };

        // Realtime Stats
        onSnapshot(doc(db, "stats", "global"), (doc) => {
            if (doc.exists()) {
                const data = doc.data();
                document.getElementById('total-wishes').innerText = data.totalWishes || 0;
                document.getElementById('total-coins').innerText = data.totalCoins || 0;
            }
        });

        // Modal Helpers
        window.openModal = (id) => document.getElementById(id).style.display = 'flex';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

        // --- THREE.JS SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0e17, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.01;
        controls.minDistance = 5;
        controls.maxDistance = 30;

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x1a2636, 1.5);
        scene.add(ambientLight);

        const moonLight = new THREE.DirectionalLight(0x88bbff, 1.2);
        moonLight.position.set(10, 20, 15);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 2048;
        moonLight.shadow.mapSize.height = 2048;
        scene.add(moonLight);

        const fountainGlow = new THREE.PointLight(0x00f3ff, 2, 15);
        fountainGlow.position.set(0, 3, 0);
        scene.add(fountainGlow);

        const goldGlow = new THREE.PointLight(0xffd700, 1.5, 10);
        goldGlow.position.set(0, 1, 0);
        scene.add(goldGlow);

        // --- MATERIALS ---
        const stoneMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a323d,
            roughness: 0.8,
            metalness: 0.2
        });

        const goldMaterial = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            roughness: 0.3,
            metalness: 0.8
        });

        const waterMaterial = new THREE.MeshStandardMaterial({
            color: 0x00a8ff,
            roughness: 0.1,
            metalness: 0.1,
            transparent: true,
            opacity: 0.85
        });

        // --- FOUNTAIN MODEL BUILD ---
        const fountainGroup = new THREE.Group();

        // Base Tier 1
        const base1Geo = new THREE.CylinderGeometry(7, 7.5, 0.8, 32);
        const base1 = new THREE.Mesh(base1Geo, stoneMaterial);
        base1.position.y = 0.4;
        base1.receiveShadow = true;
        base1.castShadow = true;
        fountainGroup.add(base1);

        // Outer Pool Ring
        const poolOuterGeo = new THREE.CylinderGeometry(6, 6.5, 1.2, 32);
        const poolOuter = new THREE.Mesh(poolOuterGeo, stoneMaterial);
        poolOuter.position.y = 1.4;
        poolOuter.receiveShadow = true;
        poolOuter.castShadow = true;
        fountainGroup.add(poolOuter);

        // Pool Water
        const poolWaterGeo = new THREE.CylinderGeometry(5.8, 5.8, 0.1, 32);
        const poolWater = new THREE.Mesh(poolWaterGeo, waterMaterial);
        poolWater.position.y = 1.8;
        fountainGroup.add(poolWater);

        // Center Column Base
        const columnBaseGeo = new THREE.CylinderGeometry(2, 2.3, 1.5, 16);
        const columnBase = new THREE.Mesh(columnBaseGeo, stoneMaterial);
        columnBase.position.y = 2.45;
        columnBase.castShadow = true;
        fountainGroup.add(columnBase);

        // Tier 2 Basin
        const tier2Geo = new THREE.CylinderGeometry(3.5, 2, 0.8, 24);
        const tier2 = new THREE.Mesh(tier2Geo, stoneMaterial);
        tier2.position.y = 3.6;
        tier2.castShadow = true;
        fountainGroup.add(tier2);

        // Tier 2 Water
        const tier2WaterGeo = new THREE.CylinderGeometry(3.3, 3.3, 0.1, 24);
        const tier2Water = new THREE.Mesh(tier2WaterGeo, waterMaterial);
        tier2Water.position.y = 3.95;
        fountainGroup.add(tier2Water);

        // Center Upper Column
        const upperColGeo = new THREE.CylinderGeometry(1, 1.2, 2, 16);
        const upperCol = new THREE.Mesh(upperColGeo, stoneMaterial);
        upperCol.position.y = 4.8;
        upperCol.castShadow = true;
        fountainGroup.add(upperCol);

        // Top Spout Ornament
        const topOrbGeo = new THREE.IcosahedronGeometry(0.8, 2);
        const topOrb = new THREE.Mesh(topOrbGeo, goldMaterial);
        topOrb.position.y = 6;
        topOrb.castShadow = true;
        fountainGroup.add(topOrb);

        // Gold Accents
        const ringGeo = new THREE.TorusGeometry(3.6, 0.08, 16, 100);
        const ring = new THREE.Mesh(ringGeo, goldMaterial);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 4;
        fountainGroup.add(ring);

        scene.add(fountainGroup);

        // --- ENVIRONMENT FLOOR ---
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x070a10, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- WATER PARTICLES (FOUNTAIN SPRAY) ---
        const particleCount = 1200;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = 0;
            positions[i * 3 + 1] = 6;
            positions[i * 3 + 2] = 0;

            const angle = Math.random() * Math.PI * 2;
            const speed = 0.03 + Math.random() * 0.04;
            velocities.push({
                x: Math.cos(angle) * speed,
                y: 0.12 + Math.random() * 0.08,
                z: Math.sin(angle) * speed
            });
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const particleMat = new THREE.PointsMaterial({
            color: 0x88f0ff,
            size: 0.12,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending
        });

        const waterParticles = new THREE.Points(particleGeo, particleMat);
        scene.add(waterParticles);

        // --- ANIMATION LOOP ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Water Particles Animation
            const pos = waterParticles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                let idx = i * 3;
                
                pos[idx] += velocities[i].x;
                pos[idx + 1] += velocities[i].y;
                pos[idx + 2] += velocities[i].z;

                velocities[i].y -= 0.005; // Gravity

                // Reset particles when hitting pools
                if (pos[idx + 1] < 1.8 && Math.sqrt(pos[idx]*pos[idx] + pos[idx+2]*pos[idx+2]) < 6) {
                    pos[idx] = (Math.random() - 0.5) * 0.2;
                    pos[idx + 1] = 6;
                    pos[idx + 2] = (Math.random() - 0.5) * 0.2;
                    
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 0.02 + Math.random() * 0.04;
                    velocities[i].x = Math.cos(angle) * speed;
                    velocities[i].y = 0.1 + Math.random() * 0.06;
                    velocities[i].z = Math.sin(angle) * speed;
                }
            }
            waterParticles.geometry.attributes.position.needsUpdate = true;

            // Gentle pulsating lights
            fountainGlow.intensity = 2 + Math.sin(elapsedTime * 2) * 0.5;
            topOrb.rotation.y += 0.01;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Resize Listener
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>✨ Neon Wishing Fountain 3D ✨</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #010409; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.8s ease; touch-action: none; color: #e0f7fa; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* Fast Loader Screen */
        #loader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #010409; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px; height: 50px; border: 3px solid rgba(0, 212, 255, 0.2);
            border-top: 3px solid #00d4ff; border-radius: 50%;
            animation: spin 1s linear infinite; box-shadow: 0 0 15px rgba(0,212,255,0.5);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loader p { margin-top: 15px; color: #00d4ff; font-size: 14px; letter-spacing: 1px; }

        /* UI Counter */
        #counter-badge {
            position: absolute; top: 20px; left: 20px;
            background: rgba(10, 25, 47, 0.6); backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 212, 255, 0.5); padding: 10px 18px;
            border-radius: 16px; color: #fff; font-size: 14px; font-weight: 600;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4); display: flex; align-items: center; gap: 8px;
            z-index: 10; transition: all 0.5s ease; pointer-events: none;
        }
        #counter-badge span { color: #ffb703; font-size: 20px; font-weight: bold; text-shadow: 0 0 15px rgba(255,183,3,0.7); }

        .top-right-controls {
            position: absolute; top: 20px; right: 20px;
            display: flex; gap: 10px; z-index: 10;
        }

        .ctrl-btn {
            background: rgba(10, 25, 47, 0.6); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2); padding: 10px 16px;
            border-radius: 20px; color: #fff; font-size: 13px; font-weight: bold;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }
        .ctrl-btn:hover { transform: scale(1.05); border-color: rgba(0, 212, 255, 0.6); box-shadow: 0 0 15px rgba(0, 212, 255, 0.4); }

        #auth-btn { border-color: rgba(255, 183, 3, 0.6); color: #ffb703; box-shadow: 0 0 10px rgba(255, 183, 3, 0.3); }

        #slogan {
            position: absolute; top: 85px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 25, 47, 0.4); backdrop-filter: blur(10px);
            padding: 8px 30px; border-radius: 25px; color: #e0f7fa;
            font-size: 16px; font-style: italic; font-weight: 300; letter-spacing: 1.5px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.8), 0 0 10px rgba(0, 212, 255, 0.5);
            z-index: 5; pointer-events: none; transition: all 0.5s ease; white-space: nowrap;
        }

        #ui {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; background: rgba(10, 25, 47, 0.7);
            padding: 10px 15px; border-radius: 35px; backdrop-filter: blur(15px);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.5); border: 1px solid rgba(0, 212, 255, 0.3);
            z-index: 10; transition: all 0.5s ease; max-width: 90vw;
        }
        input {
            padding: 12px 20px; border-radius: 25px; border: 1px solid rgba(0, 212, 255, 0.3); outline: none;
            width: 220px; font-size: 15px; background: rgba(1, 4, 9, 0.8); color: #fff;
            transition: all 0.3s ease; box-shadow: inset 0 0 5px rgba(0, 212, 255, 0.2);
        }
        input:focus { border-color: #00d4ff; box-shadow: 0 0 15px rgba(0, 212, 255, 0.6), inset 0 0 10px rgba(0, 212, 255, 0.3); }
        
        button.throw-btn {
            padding: 12px 22px; border-radius: 25px; border: none;
            background: linear-gradient(135deg, #ffb703, #fb8500); color: #000;
            font-weight: bold; font-size: 15px; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.6); white-space: nowrap; text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        button.throw-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 25px rgba(255, 183, 3, 0.9); }

        /* Modals Style */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            background: rgba(10, 25, 47, 0.95); backdrop-filter: blur(25px);
            border: 2px solid #00d4ff; padding: 30px 35px; border-radius: 20px;
            color: #fff; text-align: center; box-shadow: 0 0 40px rgba(0, 212, 255, 0.6);
            opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 20; width: 300px; max-width: 85vw;
        }
        .modal.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        .modal h3 { margin: 0 0 15px 0; color: #00d4ff; font-size: 20px; text-shadow: 0 0 10px rgba(0,212,255,0.7); }
        .modal input { width: 80%; margin-bottom: 12px; display: block; margin-left: auto; margin-right: auto; }
        .modal button.submit-btn { margin-top: 10px; width: 90%; padding: 12px; font-size: 15px; background: linear-gradient(135deg, #00d4ff, #0088cc); color: #000; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(0,212,255,0.5); }
        .modal .switch-link { margin-top: 15px; font-size: 12px; color: #ffb703; cursor: pointer; text-decoration: underline; }
        .close-btn { position: absolute; top: 10px; right: 15px; color: #aaa; font-size: 18px; cursor: pointer; }

        #wishModal { border-color: #ffb703; box-shadow: 0 0 40px rgba(255, 183, 3, 0.6); }
        #wishModal h3 { color: #ffb703; text-shadow: 0 0 10px rgba(255,183,3,0.7); }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <p>Awakening the Fountain...</p>
    </div>

    <div id="canvas-container"></div>
    
    <div id="counter-badge">
        ✨ Wishes: <span id="wishCounter">0</span>
    </div>

    <div id="slogan">Make your wish come true...</div>

    <div class="top-right-controls">
        <button id="auth-btn" class="ctrl-btn" onclick="openAuthModal()">🔑 Login / Sign Up</button>
        <button id="theme-toggle" class="ctrl-btn" onclick="toggleDayNight()">☀️ Day / 🌙 Night</button>
    </div>

    <div id="ui">
        <input type="text" id="wishInput" placeholder="Write a wish...">
        <button class="throw-btn" onclick="handleWishSubmit()">Throw € (1€)</button>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="modal">
        <span class="close-btn" onclick="closeAuthModal()">✕</span>
        <h3 id="authTitle">Sign In</h3>
        <input type="text" id="authUsername" placeholder="Username">
        <input type="password" id="authPassword" placeholder="Password">
        <button class="submit-btn" onclick="submitAuth()" id="authSubmitBtn">Login</button>
        <div class="switch-link" id="authSwitch" onclick="toggleAuthMode()">Don't have an account? Sign Up</div>
    </div>

    <!-- Wish Display Modal -->
    <div id="wishModal" class="modal">
        <h3>✨ A wish revealed:</h3>
        <p id="wishTextDisplay" style="font-size: 18px; font-style: italic; margin: 15px 0; color: #e0f7fa;">"..."</p>
        <button class="submit-btn" style="background: linear-gradient(135deg, #ffb703, #fb8500);" onclick="closeWishModal()">Close</button>
    </div>

    <script>
        const API_URL = 'https://fountain-backend-mgxf.onrender.com/api';
        let currentUser = null;
        let isSignUpMode = false;

        // Auth Logic
        function openAuthModal() { document.getElementById('authModal').classList.add('active'); }
        function closeAuthModal() { document.getElementById('authModal').classList.remove('active'); }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('authTitle').innerText = isSignUpMode ? "Create Account" : "Sign In";
            document.getElementById('authSubmitBtn').innerText = isSignUpMode ? "Sign Up" : "Login";
            document.getElementById('authSwitch').innerText = isSignUpMode ? "Already have an account? Sign In" : "Don't have an account? Sign Up";
        }

        async function submitAuth() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            if (!username || !password) return alert("Please fill in all fields.");

            const endpoint = isSignUpMode ? '/auth/signup' : '/auth/login';

            try {
                const res = await fetch(API_URL + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok) return alert(data.message || "Authentication failed.");

                localStorage.setItem('fountain_token', data.token);
                currentUser = data.user;
                updateUserUI();
                closeAuthModal();
                alert(isSignUpMode ? "Account created successfully!" : "Logged in successfully!");
            } catch (err) {
                console.error("Auth Error:", err);
                alert("Server error. Please try again.");
            }
        }

        function updateUserUI() {
            const authBtn = document.getElementById('auth-btn');
            const token = localStorage.getItem('fountain_token');
            if (token) {
                authBtn.innerText = "👤 Account";
                authBtn.style.borderColor = "#00d4ff";
                authBtn.style.color = "#00d4ff";
            } else {
                authBtn.innerText = "🔑 Login / Sign Up";
                authBtn.style.borderColor = "#ffb703";
                authBtn.style.color = "#ffb703";
            }
        }

        async function handleWishSubmit() {
            const wishText = document.getElementById('wishInput').value.trim();
            if (!wishText) return alert("Please write a wish first!");

            try {
                const res = await fetch(API_URL + '/wishes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: wishText, isPublic: true })
                });

                if (res.ok) {
                    playSplashSound();
                    spawn3DCoin(wishText);
                    document.getElementById('wishInput').value = '';
                    loadExistingWishes();
                } else {
                    alert("Error saving your wish.");
                }
            } catch (err) {
                console.error("Wish Submit Error:", err);
            }
        }

        // --- Sound Engine ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSplashSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.start(); osc.stop(audioCtx.currentTime + 0.35);
        }

        function toggleDayNight() {}

        // --- 3D SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010409, 0.03);
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4.5, 7.5);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.target.set(0, 0.8, 0);

        const ambientLight = new THREE.AmbientLight(0x0a192f, 1.5); scene.add(ambientLight);
        const mainDirLight = new THREE.DirectionalLight(0xfff5ea, 2.0); mainDirLight.position.set(5, 10, 5); scene.add(mainDirLight);
        const poolLight = new THREE.PointLight(0x00d4ff, 8, 12); poolLight.position.set(0, 1.2, 0); scene.add(poolLight);

        // --- 2-TIER FOUNTAIN MESH ---
        const fountainGroup = new THREE.Group();
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x2b3036, roughness: 0.8 });
        const waterMat = new THREE.MeshPhysicalMaterial({ color: 0x0088cc, roughness: 0.01, transmission: 0.85, transparent: true });

        // Base Pool
        const basePool = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.8, 0.8, 48), stoneMat);
        const baseWater = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.4, 0.5, 48), waterMat);
        baseWater.position.y = 0.15;
        fountainGroup.add(basePool);
        fountainGroup.add(baseWater);

        // Middle Pillar
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 1.4, 32), stoneMat);
        pillar.position.y = 1.0;
        fountainGroup.add(pillar);

        // Top Tier
        const topTier = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.1, 0.2, 48), stoneMat);
        topTier.position.y = 1.7;
        const topWater = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 0.1, 48), waterMat);
        topWater.position.y = 1.8;
        fountainGroup.add(topTier);
        fountainGroup.add(topWater);

        scene.add(fountainGroup);

        // --- WATER PARTICLES ---
        const particleCount = 250;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleVelocities = [];

        for (let i = 0; i < particleCount; i++) {
            particlePositions[i * 3] = (Math.random() - 0.5) * 0.3;
            particlePositions[i * 3 + 1] = 1.8 + Math.random() * 0.5;
            particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 0.3;

            particleVelocities.push({
                x: (Math.random() - 0.5) * 0.04,
                y: Math.random() * 0.05 + 0.04,
                z: (Math.random() - 0.5) * 0.04
            });
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.06,
            transparent: true,
            opacity: 0.85
        });
        const waterParticles = new THREE.Points(particleGeo, particleMat);
        scene.add(waterParticles);

        function animateWaterParticles() {
            const positions = waterParticles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] += particleVelocities[i].x;
                positions[i * 3 + 1] += particleVelocities[i].y;
                positions[i * 3 + 2] += particleVelocities[i].z;

                particleVelocities[i].y -= 0.002;

                if (positions[i * 3 + 1] <= 0.3) {
                    positions[i * 3] = (Math.random() - 0.5) * 0.2;
                    positions[i * 3 + 1] = 1.85;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 0.2;
                    particleVelocities[i].y = Math.random() * 0.05 + 0.04;
                }
            }
            waterParticles.geometry.attributes.position.needsUpdate = true;
        }

        // --- COINS IN FOUNTAIN ---
        const coins = [];
        const coinGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.02, 16);
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xffb703, metalness: 0.8, roughness: 0.2 });

        function spawn3DCoin(wishText) {
            const coin = new THREE.Mesh(coinGeo, coinMat);
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 1.8;
            coin.position.set(Math.cos(angle) * radius, 0.35, Math.sin(angle) * radius);
            coin.rotation.x = Math.PI / 2;
            coin.userData = { wishText };
            scene.add(coin);
            coins.push(coin);
        }

        // --- FETCH EXISTING WISHES FROM BACKEND ---
        async function loadExistingWishes() {
            try {
                const res = await fetch(API_URL + '/wishes');
                if (res.ok) {
                    const wishes = await res.json();
                    document.getElementById('wishCounter').innerText = wishes.length;

                    coins.forEach(c => scene.remove(c));
                    coins.length = 0;

                    wishes.forEach(w => spawn3DCoin(w.text));
                }
            } catch (err) {
                console.error("Error loading wishes:", err);
            }

            setTimeout(() => {
                const loader = document.getElementById('loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
            }, 300);
            updateUserUI();
        }

        function showWishModal(text) { document.getElementById('wishTextDisplay').innerText = `"${text}"`; document.getElementById('wishModal').classList.add('active'); }
        function closeWishModal() { document.getElementById('wishModal').classList.remove('active'); }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(coins);
            if (intersects.length > 0) {
                const wishText = intersects[0].object.userData.wishText;
                if (wishText) showWishModal(wishText);
            }
        });

        loadExistingWishes();

        function animate() {
            requestAnimationFrame(animate);
            animateWaterParticles();
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wish Fountain - Ψηφιακό Σιντριβάνι Ευχών</title>
    
    <!-- CSS / Fonts / Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #ffd700;
            --dark-bg: #0a0e17;
            --panel-bg: rgba(16, 24, 39, 0.85);
            --neon-blue: #00f3ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .interactive {
            pointer-events: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-container {
            display: flex;
            gap: 20px;
            font-size: 16px;
        }

        .stat-box {
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-value {
            color: var(--primary-gold);
            font-weight: bold;
        }

        .user-controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(45deg, #ffd700, #ffa500);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
            box-shadow: none;
        }

        .main-action {
            align-self: center;
            margin-bottom: 30px;
        }

        .btn-wish {
            font-size: 20px;
            padding: 15px 40px;
            border-radius: 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--primary-gold);
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }

        .close-btn:hover { color: #fff; }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-gold);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.5);
            color: #fff;
            outline: none;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .wishes-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .wish-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,215,0,0.2);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .wish-card-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .google-btn {
            background: #4285F4;
            color: white;
            width: 100%;
            margin-top: 10px;
        }
    </style>

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <header class="interactive">
            <div class="logo">
                <i class="fas fa-coins"></i> Wish Fountain
            </div>
            <div class="stats-container">
                <div class="stat-box">Συνολικές Ευχές: <span id="total-wishes" class="stat-value">0</span></div>
                <div class="stat-box">Νομίσματα: <span id="total-coins" class="stat-value">0</span></div>
            </div>
            <div class="user-controls" id="auth-buttons">
                <button class="btn btn-secondary" onclick="openModal('auth-modal')">Σύνδεση</button>
            </div>
        </header>

        <div class="main-action interactive">
            <button class="btn btn-wish" onclick="handleWishButtonClick()">
                <i class="fas fa-magic"></i> Κάνε μια Ευχή (1€)
            </button>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal interactive">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('auth-modal')">&times;</span>
            <h2 style="margin-bottom: 20px; color: var(--primary-gold);">Είσοδος / Εγγραφή</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="auth-email" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Κωδικός</label>
                <input type="password" id="auth-password" placeholder="******">
            </div>
            <button class="btn" style="width: 100%;" onclick="handleEmailAuth()">Σύνδεση / Εγγραφή</button>
            <button class="btn google-btn" onclick="handleGoogleAuth()">
                <i class="fab fa-google"></i> Σύνδεση με Google
            </button>
        </div>
    </div>

    <!-- Wish Modal -->
    <div id="wish-modal" class="modal interactive">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('wish-modal')">&times;</span>
            <h2 style="margin-bottom: 20px; color: var(--primary-gold);">Γράψε την Ευχή σου</h2>
            <div class="form-group">
                <label>Η Ευχή σου</label>
                <textarea id="wish-text" placeholder="Γράψε εδώ αυτό που εύχεσαι..."></textarea>
            </div>
            <button class="btn" style="width: 100%;" onclick="submitWishAndPay()">
                Ρίξε το Νόμισμα & Πλήρωσε (1€)
            </button>
        </div>
    </div>

    <!-- My Wishes Modal -->
    <div id="my-wishes-modal" class="modal interactive">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('my-wishes-modal')">&times;</span>
            <h2 style="margin-bottom: 20px; color: var(--primary-gold);">Οι Ευχές μου</h2>
            <div class="wishes-list" id="my-wishes-container">
                <!-- Δυναμική φόρτωση ευχών -->
            </div>
        </div>
    </div>

    <!-- App Logic (Firebase + Three.js) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            onSnapshot, 
            collection, 
            query, 
            where, 
            getDocs 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const stripe = Stripe('YOUR_STRIPE_PUBLIC_KEY');

        let currentUser = null;

        // --- Auth Listeners ---
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const authContainer = document.getElementById('auth-buttons');
            if (user) {
                authContainer.innerHTML = `
                    <button class="btn btn-secondary" onclick="openMyWishes()">Οι Ευχές μου</button>
                    <button class="btn btn-secondary" onclick="handleSignOut()">Αποσύνδεση</button>
                `;
            } else {
                authContainer.innerHTML = `
                    <button class="btn btn-secondary" onclick="openModal('auth-modal')">Σύνδεση</button>
                `;
            }
        });

        // Global functions for UI access
        window.handleEmailAuth = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                closeModal('auth-modal');
            } catch (err) {
                try {
                    await createUserWithEmailAndPassword(auth, email, pass);
                    closeModal('auth-modal');
                } catch (createErr) {
                    alert("Σφάλμα αυθεντικοποίησης: " + createErr.message);
                }
            }
        };

        window.handleGoogleAuth = async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                closeModal('auth-modal');
            } catch (err) {
                alert("Σφάλμα σύνδεσης Google: " + err.message);
            }
        };

        window.handleSignOut = () => signOut(auth);

        window.handleWishButtonClick = () => {
            if (!currentUser) {
                openModal('auth-modal');
            } else {
                openModal('wish-modal');
            }
        };

        window.submitWishAndPay = async () => {
            const text = document.getElementById('wish-text').value;
            if (!text) return alert("Παρακαλώ γράψε μια ευχή.");

            try {
                const response = await fetch('https://fountain-backend-mgxf.onrender.com/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        wishText: text,
                        userId: currentUser.uid,
                        userEmail: currentUser.email
                    })
                });
                
                const session = await response.json();
                if (session.url) {
                    window.location.href = session.url;
                } else if (session.id) {
                    await stripe.redirectToCheckout({ sessionId: session.id });
                }
            } catch (err) {
                alert("Σφάλμα κατά την πληρωμή: " + err.message);
            }
        };

        window.openMyWishes = async () => {
            if (!currentUser) return;
            const container = document.getElementById('my-wishes-container');
            container.innerHTML = 'Φόρτωση...';
            openModal('my-wishes-modal');

            const q = query(collection(db, "wishes"), where("userId", "==", currentUser.uid));
            const querySnapshot = await getDocs(q);
            
            container.innerHTML = '';
            if(querySnapshot.empty) {
                container.innerHTML = '<p>Δεν έχεις κάνει ακόμα κάποια ευχή.</p>';
                return;
            }

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = 'wish-card';
                card.innerHTML = `
                    <div class="wish-card-header">
                        <span>${data.createdAt ? new Date(data.createdAt.toDate()).toLocaleDateString('el-GR') : ''}</span>
                    </div>
                    <div>${data.text}</div>
                `;
                container.appendChild(card);
            });
        };

        // Realtime Stats
        onSnapshot(doc(db, "stats", "global"), (doc) => {
            if (doc.exists()) {
                const data = doc.data();
                document.getElementById('total-wishes').innerText = data.totalWishes || 0;
                document.getElementById('total-coins').innerText = data.totalCoins || 0;
            }
        });

        // Modal Helpers
        window.openModal = (id) => document.getElementById(id).style.display = 'flex';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

        // --- THREE.JS SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0e17, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffd700, 0.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x00f3ff, 1, 10);
        pointLight.position.set(0, 2, 0);
        scene.add(pointLight);

        // Fountain Base
        const baseGeo = new THREE.CylinderGeometry(3, 3.5, 1, 32);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.3 });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = -0.5;
        scene.add(base);

        // Water Pool
        const waterGeo = new THREE.CylinderGeometry(2.8, 2.8, 0.8, 32);
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x00aaff, roughness: 0.1, transparent: true, opacity: 0.8 });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.position.y = -0.3;
        scene.add(water);

        // Particle Water Effects
        const particleCount = 200;
        const particles = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 0.5;
            positions[i + 1] = Math.random() * 2;
            positions[i + 2] = (Math.random() - 0.5) * 0.5;
        }

        particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x00f3ff, size: 0.05 });
        const fountainParticles = new THREE.Points(particles, particleMat);
        scene.add(fountainParticles);

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Animate Particles
            const pos = fountainParticles.geometry.attributes.position.array;
            for (let i = 1; i < particleCount * 3; i += 3) {
                pos[i] += 0.02;
                if (pos[i] > 2.5) pos[i] = 0;
            }
            fountainParticles.geometry.attributes.position.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Resize Listener
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

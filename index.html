<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Wishing Fountain</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020611; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.8s ease; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        #counter-badge {
            position: absolute; top: 20px; left: 20px;
            background: rgba(10, 25, 47, 0.75); backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 212, 255, 0.3); padding: 10px 16px;
            border-radius: 16px; color: #fff; font-size: 14px; font-weight: 600;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 8px;
            z-index: 10; transition: all 0.5s ease; pointer-events: none;
        }
        #counter-badge span { color: #ffb703; font-size: 18px; font-weight: bold; text-shadow: 0 0 10px rgba(255,183,3,0.5); }

        #theme-toggle {
            position: absolute; top: 20px; right: 20px;
            background: rgba(10, 25, 47, 0.75); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2); padding: 10px 16px;
            border-radius: 20px; color: #fff; font-size: 13px; font-weight: bold;
            cursor: pointer; z-index: 10; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #theme-toggle:hover { transform: scale(1.05); background: rgba(0, 212, 255, 0.2); }

        #ui {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; background: rgba(10, 25, 47, 0.8);
            padding: 8px 12px; border-radius: 30px; backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15);
            z-index: 10; transition: all 0.5s ease; max-width: 90vw;
        }
        input {
            padding: 10px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); outline: none;
            width: 180px; font-size: 14px; background: rgba(255, 255, 255, 0.95); color: #000;
        }
        button.throw-btn {
            padding: 10px 18px; border-radius: 20px; border: none;
            background: linear-gradient(135deg, #ffb703, #fb8500); color: #000;
            font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(251, 133, 0, 0.4); white-space: nowrap;
        }

        body.day-mode { background-color: #87ceeb; }
        body.day-mode #counter-badge, body.day-mode #theme-toggle, body.day-mode #ui {
            background: rgba(255, 255, 255, 0.7); color: #1a2b4c; border-color: rgba(255, 255, 255, 0.8); box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        #wishModal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            background: rgba(10, 25, 47, 0.92); backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.4); padding: 25px 30px; border-radius: 20px;
            color: #fff; text-align: center; box-shadow: 0 15px 50px rgba(0, 212, 255, 0.25);
            opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 20; max-width: 85vw;
        }
        #wishModal.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        #wishModal h3 { margin: 0 0 10px 0; color: #ffb703; font-size: 16px; }
        #wishModal p { font-size: 18px; font-style: italic; margin: 12px 0; color: #e0f7fa; line-height: 1.4; }
        #wishModal button { margin-top: 8px; padding: 8px 20px; font-size: 13px; background: #00d4ff; color: #000; border: none; border-radius: 18px; font-weight: bold; cursor: pointer; }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="counter-badge"> Ευχές: <span id="wishCounter">0</span></div>
    <button id="theme-toggle" onclick="toggleDayNight()">☀️ Μέρα / 🌙 Νύχτα</button>

    <div id="ui">
        <input type="text" id="wishInput" placeholder="Γράψε μια ευχή...">
        <button class="throw-btn" onclick="throwCoin()">Ρίξε 🪙</button>
    </div>

    <div id="wishModal">
        <h3>✨ Μια ευχή που διαβάστηκε:</h3>
        <p id="wishTextDisplay">"..."</p>
        <button onclick="closeWishModal()">Κλείσιμο</button>
    </div>

    <script>
        const API_URL = 'https://fountain-backend-mgxf.onrender.com/api/wishes';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSplashSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const bufferSize = audioCtx.sampleRate * 0.35;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1400, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.9, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.32);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020611, 0.03);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4.2, 6.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0.8, 0);
        controls.minDistance = 3.5;
        controls.maxDistance = 12;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        const ambientLight = new THREE.AmbientLight(0x1c2d42, 1.5);
        scene.add(ambientLight);

        const mainDirLight = new THREE.DirectionalLight(0xfff5ea, 2.5);
        mainDirLight.position.set(5, 10, 5);
        mainDirLight.castShadow = true;
        scene.add(mainDirLight);

        const poolLight = new THREE.PointLight(0x00d4ff, 4, 10);
        poolLight.position.set(0, 0.6, 0);
        scene.add(poolLight);

        let isDayMode = false;
        function toggleDayNight() {
            isDayMode = !isDayMode;
            document.body.classList.toggle('day-mode', isDayMode);
            if (isDayMode) {
                scene.fog.color.setHex(0x87ceeb);
                ambientLight.color.setHex(0xffffff);
                ambientLight.intensity = 2.2;
                mainDirLight.intensity = 3.5;
                poolLight.intensity = 1.0;
            } else {
                scene.fog.color.setHex(0x020611);
                ambientLight.color.setHex(0x1c2d42);
                ambientLight.intensity = 1.5;
                mainDirLight.intensity = 2.5;
                poolLight.intensity = 4.0;
            }
        }

        const fountainGroup = new THREE.Group();
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x3d4353, roughness: 0.8, metalness: 0.2 });

        const base = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.6, 0.8, 48), stoneMat);
        base.receiveShadow = base.castShadow = true;
        fountainGroup.add(base);

        const rim = new THREE.Mesh(new THREE.TorusGeometry(2.35, 0.18, 16, 48), stoneMat);
        rim.rotation.x = Math.PI / 2; rim.position.y = 0.4; rim.castShadow = true;
        fountainGroup.add(rim);

        const centerCol = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 1.4, 24), stoneMat);
        centerCol.position.y = 0.7; centerCol.castShadow = true;
        fountainGroup.add(centerCol);

        const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.3, 0.35, 32), stoneMat);
        bowl.position.y = 1.4; bowl.castShadow = true;
        fountainGroup.add(bowl);

        const waterMat = new THREE.MeshPhysicalMaterial({
            color: 0x0088cc, roughness: 0.05, transmission: 0.85, opacity: 0.9, transparent: true,
            ior: 1.333, reflectivity: 0.9, clearcoat: 1.0, clearcoatRoughness: 0.1
        });

        const water = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 0.5, 48), waterMat);
        water.position.y = 0.15; water.receiveShadow = true;
        fountainGroup.add(water);

        const topWater = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.1, 32), waterMat);
        topWater.position.y = 1.52;
        fountainGroup.add(topWater);

        scene.add(fountainGroup);

        const waterfall = new THREE.Mesh(
            new THREE.CylinderGeometry(0.88, 0.92, 0.9, 32, 1, true),
            new THREE.MeshBasicMaterial({ color: 0x80e5ff, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
        );
        waterfall.position.y = 0.95;
        fountainGroup.add(waterfall);

        const particleCount = 400;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = 0; positions[i * 3 + 1] = 1.6; positions[i * 3 + 2] = 0;
            velocities.push({ x: (Math.random() - 0.5) * 0.04, y: 0.06 + Math.random() * 0.04, z: (Math.random() - 0.5) * 0.04 });
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const waterParticles = new THREE.Points(particleGeo, new THREE.PointsMaterial({ color: 0xcceeff, size: 0.05, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending }));
        scene.add(waterParticles);

        const ripples = [];
        function createRippleEffect(x, z) {
            const ring = new THREE.Mesh(new THREE.RingGeometry(0.05, 0.12, 32), new THREE.MeshBasicMaterial({ color: 0x80ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.9 }));
            ring.rotation.x = Math.PI / 2; ring.position.set(x, 0.41, z);
            scene.add(ring);
            ripples.push({ mesh: ring, scale: 1, opacity: 0.9 });
        }

        const coins = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isDragging = false;
        let pointerDownTime = 0;

        window.addEventListener('pointerdown', () => { isDragging = false; pointerDownTime = Date.now(); });
        window.addEventListener('pointermove', () => { isDragging = true; });
        window.addEventListener('pointerup', (event) => {
            if (Date.now() - pointerDownTime < 250 && (!isDragging || event.pointerType === 'touch')) onCoinClick(event);
        });

        function onCoinClick(event) {
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'BUTTON') return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(coins);
            if (intersects.length > 0) showWishModal(intersects[0].object.userData.wishText);
        }

        function showWishModal(text) {
            document.getElementById('wishTextDisplay').innerText = `"${text}"`;
            document.getElementById('wishModal').classList.add('active');
        }
        function closeWishModal() { document.getElementById('wishModal').classList.remove('active'); }

        function updateCounterUI(count) {
            const counterEl = document.getElementById('wishCounter');
            counterEl.innerText = count;
            counterEl.parentElement.style.transform = 'scale(1.15)';
            setTimeout(() => counterEl.parentElement.style.transform = 'scale(1)', 200);
        }

        function addStaticCoinToScene(wishText) {
            const targetX = (Math.random() - 0.5) * 1.6;
            const targetZ = (Math.random() - 0.5) * 1.6;
            const coin = new THREE.Mesh(
                new THREE.CylinderGeometry(0.12, 0.12, 0.02, 20),
                new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.95, roughness: 0.1 })
            );
            coin.position.set(targetX, 0.39, targetZ);
            coin.castShadow = true;
            coin.userData = { wishText: wishText };
            fountainGroup.add(coin);
            coins.push(coin);
        }

        async function loadExistingWishes() {
            try {
                const res = await fetch(API_URL);
                const wishes = await res.json();
                wishes.forEach(wish => addStaticCoinToScene(wish.text));
                updateCounterUI(wishes.length);
            } catch (err) { console.error("Σφάλμα φόρτωσης:", err); }
        }
        loadExistingWishes();

        function animateFallingCoin(wishText) {
            const coin = new THREE.Mesh(
                new THREE.CylinderGeometry(0.12, 0.12, 0.02, 20),
                new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.95, roughness: 0.1 })
            );
            const startX = (Math.random() - 0.5) * 0.4, startY = 4.8, startZ = 4.2;
            const targetX = (Math.random() - 0.5) * 1.6, targetY = 0.39, targetZ = (Math.random() - 0.5) * 1.6;

            coin.position.set(startX, startY, startZ);
            coin.castShadow = true;
            coin.userData = { wishText: wishText };
            fountainGroup.add(coin);

            let progress = 0;
            function fallStep() {
                progress += 0.022;
                if (progress < 1) {
                    coin.position.x = startX + (targetX - startX) * progress;
                    coin.position.z = startZ + (targetZ - startZ) * progress;
                    coin.position.y = startY + (targetY - startY) * progress + Math.sin(progress * Math.PI) * 1.4;
                    coin.rotation.x += 0.25; coin.rotation.y += 0.18;
                    requestAnimationFrame(fallStep);
                } else {
                    coin.position.set(targetX, targetY, targetZ);
                    coin.rotation.set(0, Math.random() * Math.PI, 0);
                    coins.push(coin);
                    playSplashSound();
                    createRippleEffect(targetX, targetZ);
                    updateCounterUI(coins.length);
                }
            }
            fallStep();
        }

        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            const time = clock.getElapsedTime();

            const pos = waterParticles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                pos[i * 3] += velocities[i].x; pos[i * 3 + 1] += velocities[i].y; pos[i * 3 + 2] += velocities[i].z;
                velocities[i].y -= 0.002;
                if (pos[i * 3 + 1] < 0.35) {
                    pos[i * 3] = 0; pos[i * 3 + 1] = 1.6; pos[i * 3 + 2] = 0;
                    velocities[i].y = 0.06 + Math.random() * 0.04;
                }
            }
            waterParticles.geometry.attributes.position.needsUpdate = true;

            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                r.scale += 0.07; r.opacity -= 0.025;
                r.mesh.scale.set(r.scale, r.scale, 1);
                r.mesh.material.opacity = r.opacity;
                if (r.opacity <= 0) { scene.remove(r.mesh); ripples.splice(i, 1); }
            }

            waterfall.material.opacity = 0.3 + Math.sin(time * 5) * 0.08;
            water.rotation.y = time * 0.03;
            coins.forEach(c => c.rotation.y += 0.008);
            renderer.render(scene, camera);
        }
        animate();

        async function throwCoin() {
            const input = document.getElementById('wishInput');
            const wishText = input.value.trim();
            if (!wishText) return alert("Γράψε πρώτα μια ευχή!");

            animateFallingCoin(wishText);

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: wishText })
                });
                input.value = '';
            } catch (err) { console.error("Σφάλμα σύνδεσης:", err); }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

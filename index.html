<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Το Μαγικό Συντριβάνι των Ευχών ✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #686de0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .fountain-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .fountain-icon {
            font-size: 55px;
            margin-bottom: 10px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #1e3c72;
            font-size: 26px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #4834d4;
        }

        .btn-add {
            background: linear-gradient(135deg, #4834d4, #686de0);
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(72, 52, 212, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(72, 52, 212, 0.4);
        }

        .wishes-title {
            text-align: left;
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        ul {
            list-style: none;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Scrollbar styling */
        ul::-webkit-scrollbar { width: 6px; }
        ul::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }

        li {
            background: #ffffff;
            margin-bottom: 12px;
            padding: 14px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 5px solid #686de0;
            transition: all 0.3s ease;
        }

        li.fulfilled {
            background: #f1f9f5;
            border-left-color: #2ed573;
        }

        li.fulfilled .wish-text {
            text-decoration: line-through;
            color: #a4b0be;
        }

        .wish-text {
            text-align: left;
            font-size: 15px;
            color: #2f3542;
            word-break: break-word;
            flex: 1;
            padding-right: 10px;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            background: #f1f2f6;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-action:hover {
            transform: scale(1.1);
        }

        .btn-fulfill:hover { background: #e1f5fe; }
        .btn-delete:hover { background: #ffeaa7; }

        .empty-state {
            color: #888;
            font-style: italic;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="fountain-card">
    <div class="fountain-icon">⛲✨</div>
    <h1>Συντριβάνι των Ευχών</h1>
    <p class="subtitle">Ρίξε ένα εικονικό κέρμα και κάνε μια ευχή!</p>

    <!-- Φόρμα Υποβολής -->
    <div class="form-container">
        <input type="text" id="wishInput" placeholder="Γράψε την ευχή σου εδώ..." onkeypress="handleKeyPress(event)">
        <button class="btn-add" onclick="addWish()">Ρίξε Ευχή 🪙</button>
    </div>

    <div class="wishes-title">
        <span>📜</span> Ευχές στο Συντριβάνι:
    </div>

    <ul id="wishesList">
        <!-- Εδώ φορτώνονται οι ευχές -->
    </ul>
</div>

<script>
    // Live URL του Backend στο Render
    const API_URL = 'https://fountain-backend-mgxf.onrender.com/api/wishes';

    // 1. Φόρτωση όλων των ευχών
    async function fetchWishes() {
        try {
            const res = await fetch(API_URL);
            const wishes = await res.json();
            
            const list = document.getElementById('wishesList');
            list.innerHTML = '';

            if (wishes.length === 0) {
                list.innerHTML = '<div class="empty-state">Δεν υπάρχουν ευχές ακόμα. Γίνε ο πρώτος που θα ρίξει μια!</div>';
                return;
            }
            
            wishes.forEach(wish => {
                const li = document.createElement('li');
                if (wish.isFulfilled) {
                    li.className = 'fulfilled';
                }
                
                // Κείμενο ευχής
                const span = document.createElement('span');
                span.className = 'wish-text';
                span.textContent = wish.text;
                li.appendChild(span);

                // Περιοχή κουμπιών
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'actions';

                // Κουμπί Εκπλήρωσης
                const fulfillBtn = document.createElement('button');
                fulfillBtn.className = 'btn-action btn-fulfill';
                fulfillBtn.innerHTML = wish.isFulfilled ? '↩️' : '✅';
                fulfillBtn.title = wish.isFulfilled ? 'Ακύρωση Εκπλήρωσης' : 'Εκπλήρωση Ευχής';
                fulfillBtn.onclick = () => toggleFulfill(wish._id);
                actionsDiv.appendChild(fulfillBtn);

                // Κουμπί Διαγραφής
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-action btn-delete';
                deleteBtn.innerHTML = '🗑️';
                deleteBtn.title = 'Διαγραφή Ευχής';
                deleteBtn.onclick = () => deleteWish(wish._id);
                actionsDiv.appendChild(deleteBtn);

                li.appendChild(actionsDiv);
                list.appendChild(li);
            });
        } catch (err) {
            console.error('Σφάλμα κατά τη φορτώση των ευχών:', err);
        }
    }

    // 2. Προσθήκη νέας ευχής
    async function addWish() {
        const input = document.getElementById('wishInput');
        const text = input.value.trim();
        
        if (!text) return alert('Παρακαλώ γράψε μια ευχή πριν ρίξεις το κέρμα!');

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });

            if (res.ok) {
                input.value = '';
                fetchWishes();
            }
        } catch (err) {
            console.error('Σφάλμα κατά την αποστολή:', err);
        }
    }

    // Enter Key Handler
    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            addWish();
        }
    }

    // 3. Εναλλαγή Κατάστασης Εκπλήρωσης (PUT)
    async function toggleFulfill(id) {
        try {
            const res = await fetch(`${API_URL}/${id}`, {
                method: 'PUT'
            });

            if (res.ok) {
                fetchWishes();
            }
        } catch (err) {
            console.error('Σφάλμα κατά την εκπλήρωση:', err);
        }
    }

    // 4. Διαγραφή ευχής (DELETE)
    async function deleteWish(id) {
        if (!confirm('Θέλεις σίγουρα να αφαίρεσεις αυτή την ευχή από το συντριβάνι;')) return;

        try {
            const res = await fetch(`${API_URL}/${id}`, {
                method: 'DELETE'
            });

            if (res.ok) {
                fetchWishes();
            }
        } catch (err) {
            console.error('Σφάλμα κατά τη διαγραφή:', err);
        }
    }

    // Εκκίνηση φόρτωσης ευχών
    fetchWishes();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wish Fountain</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            background-color: #050508;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .top-bar {
            position: absolute;
            top: 20px;
            width: 100%;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .badge {
            background: rgba(10, 15, 25, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            color: #ffcc00;
            font-weight: 600;
            backdrop-filter: blur(8px);
        }

        .top-right-controls {
            display: flex;
            gap: 12px;
        }

        .btn-neon {
            background: rgba(15, 12, 5, 0.8);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.2);
            backdrop-filter: blur(8px);
        }

        .btn-neon:hover {
            background: #ffaa00;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.6);
        }

        .prompt-title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(10, 15, 25, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 8px 22px;
            border-radius: 25px;
            color: #8fa0be;
            font-style: italic;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            pointer-events: none;
            font-size: 0.95rem;
        }

        /* BOTTOM BAR FIXES */
        .bottom-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 550px;
            background: rgba(8, 12, 20, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
            border-radius: 30px;
            padding: 6px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            z-index: 10;
            overflow: hidden;
        }

        .bottom-bar input[type="text"] {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .bottom-bar input::placeholder { color: #6a7b95; }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            color: #00f3ff;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-throw {
            background: linear-gradient(90deg, #ff9900, #ffbb00);
            border: none;
            color: #000;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 22px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.5);
            transition: 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .btn-throw:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.8);
        }

        /* RESPONSIVE MOBILE FIXES */
        @media (max-width: 600px) {
            .top-bar { padding: 10px 15px; gap: 8px; }
            .badge { padding: 5px 10px; font-size: 0.75rem; }
            .btn-neon { padding: 6px 12px; font-size: 0.75rem; }
            .top-right-controls { gap: 6px; }
            .prompt-title { top: 65px; font-size: 0.75rem; padding: 5px 14px; width: 85%; text-align: center; }
            
            .bottom-bar {
                bottom: 15px;
                width: 95%;
                padding: 4px 6px;
                gap: 4px;
            }

            .bottom-bar input[type="text"] {
                padding: 6px 8px;
                font-size: 0.8rem;
            }

            .checkbox-container {
                font-size: 0.7rem;
                margin: 0 2px;
            }

            .btn-throw {
                padding: 8px 12px;
                font-size: 0.75rem;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="top-bar">
        <div class="badge" id="wishesCountBadge">✨ Wishes: 0</div>
        <div class="top-right-controls">
            <button class="btn-neon" id="aboutBtn">✨ About</button>
            <button class="btn-neon" id="authBtn">🔑 Login / Sign Up</button>
        </div>
    </div>

    <div class="prompt-title">Make your wish come true... ✨</div>

    <form class="bottom-bar" id="wishForm">
        <input type="text" id="wishInput" placeholder="Make a wish..." required autocomplete="off">
        <label class="checkbox-container">
            <input type="checkbox" id="publicCheck" checked> Public
        </label>
        <button type="submit" class="btn-throw" id="submitWishBtn">Throw (1€)</button>
    </form>

    <!-- Three.js Fountain Logic -->
    <script>
        const container = document.getElementById('canvas-container');

        // Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050508, 0.05);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2.1;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const cyanLight = new THREE.PointLight(0x00f3ff, 2, 10);
        cyanLight.position.set(0, 2, 0);
        scene.add(cyanLight);

        // Fountain Mesh
        const fountainGroup = new THREE.Group();

        // Outer Pool Base
        const baseGeo = new THREE.CylinderGeometry(2.5, 3, 0.4, 32);
        const darkMat = new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.3, metalness: 0.8 });
        const base = new THREE.Mesh(baseGeo, darkMat);
        base.position.y = -1;
        fountainGroup.add(base);

        // Outer Water Surface
        const waterGeo = new THREE.CylinderGeometry(2.4, 2.4, 0.1, 32);
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.85 });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.position.y = -0.8;
        fountainGroup.add(water);

        // Center Pedestal
        const pedestalGeo = new THREE.CylinderGeometry(0.3, 0.4, 1.2, 16);
        const pedestal = new THREE.Mesh(pedestalGeo, darkMat);
        pedestal.position.y = -0.2;
        fountainGroup.add(pedestal);

        // Upper Bowl
        const bowlGeo = new THREE.CylinderGeometry(1.2, 0.8, 0.3, 32);
        const bowl = new THREE.Mesh(bowlGeo, darkMat);
        bowl.position.y = 0.4;
        fountainGroup.add(bowl);

        // Upper Water Layer
        const topWaterGeo = new THREE.CylinderGeometry(1.15, 1.15, 0.05, 32);
        const topWater = new THREE.Mesh(topWaterGeo, waterMat);
        topWater.position.y = 0.53;
        fountainGroup.add(topWater);

        scene.add(fountainGroup);

        // Water Particles
        const particleCount = 250;
        const particlesGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = 0;
            positions[i * 3 + 1] = 0.55;
            positions[i * 3 + 2] = 0;

            velocities.push({
                x: (Math.random() - 0.5) * 0.03,
                y: Math.random() * 0.05 + 0.04,
                z: (Math.random() - 0.5) * 0.03
            });
        }

        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const particleMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.05,
            transparent: true,
            opacity: 0.8
        });

        const particleSystem = new THREE.Points(particlesGeo, particleMat);
        scene.add(particleSystem);

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Water particle movement
            const pos = particleSystem.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                pos[i * 3] += velocities[i].x;
                pos[i * 3 + 1] += velocities[i].y;
                pos[i * 3 + 2] += velocities[i].z;

                velocities[i].y -= 0.0018; // gravity

                // Reset particle
                if (pos[i * 3 + 1] < 0.5) {
                    pos[i * 3] = 0;
                    pos[i * 3 + 1] = 0.55;
                    pos[i * 3 + 2] = 0;
                    velocities[i].x = (Math.random() - 0.5) * 0.03;
                    velocities[i].y = Math.random() * 0.04 + 0.035;
                    velocities[i].z = (Math.random() - 0.5) * 0.03;
                }
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;

            fountainGroup.rotation.y += 0.002;
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

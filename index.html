<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wish Fountain</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            background-color: #050508;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .top-bar {
            position: absolute;
            top: 20px;
            width: 100%;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .badge {
            background: rgba(10, 15, 25, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            color: #ffcc00;
            font-weight: 600;
            backdrop-filter: blur(8px);
        }

        .top-right-controls {
            display: flex;
            gap: 12px;
        }

        .btn-neon {
            background: rgba(15, 12, 5, 0.8);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.2);
            backdrop-filter: blur(8px);
        }

        .btn-neon:hover {
            background: #ffaa00;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.6);
        }

        .prompt-title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(10, 15, 25, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 8px 22px;
            border-radius: 25px;
            color: #8fa0be;
            font-style: italic;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            pointer-events: none;
            font-size: 0.95rem;
        }

        /* BOTTOM BAR FIXES */
        .bottom-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 550px;
            background: rgba(8, 12, 20, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
            border-radius: 30px;
            padding: 6px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            z-index: 10;
            overflow: hidden;
        }

        .bottom-bar input[type="text"] {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .bottom-bar input::placeholder { color: #6a7b95; }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            color: #00f3ff;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-throw {
            background: linear-gradient(90deg, #ff9900, #ffbb00);
            border: none;
            color: #000;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 22px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.5);
            transition: 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .btn-throw:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.8);
        }

        /* 3D COIN TOOLTIP POPUP */
        #coinTooltip {
            position: absolute;
            display: none;
            background: rgba(10, 15, 28, 0.95);
            border: 1px solid #00f3ff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            padding: 12px 16px;
            border-radius: 12px;
            color: #fff;
            z-index: 50;
            pointer-events: auto;
            max-width: 260px;
            backdrop-filter: blur(8px);
            transform: translate(-50%, -100%);
        }

        #coinTooltip .wish-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        #coinTooltip .wish-author {
            font-size: 0.75rem;
            color: #8fa0be;
            margin-bottom: 8px;
        }

        #coinTooltip .actions {
            display: flex;
            gap: 6px;
        }

        .tooltip-btn {
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .tooltip-btn.delete {
            border-color: #ff4757;
            color: #ff4757;
            background: rgba(255, 71, 87, 0.15);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #0d1322;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
            position: relative;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 12px; right: 18px;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #8fa0be; }
        .form-group input {
            width: 100%; padding: 10px; background: #050811;
            border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 8px; color: #fff; outline: none;
        }
        .form-group input:focus { border-color: #00f3ff; }

        .btn-submit-modal {
            width: 100%; padding: 12px;
            background: linear-gradient(90deg, #00f3ff, #0077ff);
            border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: #6a7b95;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: rgba(0, 243, 255, 0.2);
        }
        .divider span { padding: 0 10px; }

        .google-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        /* RESPONSIVE MOBILE FIXES */
        @media (max-width: 600px) {
            .top-bar { padding: 10px 15px; gap: 8px; }
            .badge { padding: 5px 10px; font-size: 0.75rem; }
            .btn-neon { padding: 6px 12px; font-size: 0.75rem; }
            .top-right-controls { gap: 6px; }
            .prompt-title { top: 65px; font-size: 0.75rem; padding: 5px 14px; width: 85%; text-align: center; }
            
            .bottom-bar {
                bottom: 15px;
                width: 95%;
                padding: 4px 6px;
                gap: 4px;
            }

            .bottom-bar input[type="text"] {
                padding: 6px 8px;
                font-size: 0.8rem;
            }

            .checkbox-container {
                font-size: 0.7rem;
                margin: 0 2px;
            }

            .btn-throw {
                padding: 8px 12px;
                font-size: 0.75rem;
                border-radius: 18px;
            }

            .modal-content { width: 95%; padding: 20px 15px; }
            #coinTooltip { max-width: 200px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="top-bar">
        <div class="badge" id="wishesCountBadge">✨ Wishes: 0</div>
        <div class="top-right-controls">
            <button class="btn-neon" id="aboutBtn">✨ About</button>
            <button class="btn-neon" id="authBtn">🔑 Login / Sign Up</button>
        </div>
    </div>

    <div class="prompt-title">Make your wish come true... ✨</div>

    <form class="bottom-bar" id="wishForm">
        <input type="text" id="wishInput" placeholder="Make a wish..." required autocomplete="off">
        <label class="checkbox-container">
            <input type="checkbox" id="publicCheck" checked> Public
        </label>
        <button type="submit" class="btn-throw" id="submitWishBtn">Throw (1€)</button>
    </form>

    <div id="coinTooltip">
        <div class="wish-text" id="tooltipText">Wish text goes here</div>
        <div class="wish-author" id="tooltipAuthor">by Anonymous</div>
        <div class="actions">
            <button class="tooltip-btn delete" id="tooltipDeleteBtn" style="display:none;">Delete</button>
        </div>
    </div>

    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="close-btn" id="closeAuthModal">&times;</span>
            <h2 style="margin-bottom: 20px; color: #00f3ff;" id="modalTitle">Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="authEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="authPassword" required>
                </div>
                <button type="submit" class="btn-submit-modal" id="authSubmitBtn">Login</button>
            </form>
            
            <div class="divider"><span>OR</span></div>
            <div class="google-btn-container" id="googleBtnContainer"></div>

            <p style="margin-top: 15px; font-size: 0.8rem; color: #8fa0be;">
                <span id="toggleAuthMode">Don't have an account? Sign Up</span>
            </p>
        </div>
    </div>

    <div class="modal" id="aboutModal">
        <div class="modal-content">
            <span class="close-btn" id="closeAboutModal">&times;</span>
            <h2 style="margin-bottom: 15px; color: #ffaa00;">About Wish Fountain</h2>
            <p style="color: #8fa0be; font-size: 0.9rem; line-height: 1.5;">
                Throw a coin into the digital fountain and make a wish. Your wish will be stored forever in the digital realm.
            </p>
        </div>
    </div>

</body>
</html>

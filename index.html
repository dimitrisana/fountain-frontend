<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Wishing Fountain</title>
    <!-- Three.js & Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Google Auth SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            background-color: #050508;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .top-bar {
            position: absolute;
            top: 20px;
            width: 100%;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .badge {
            background: rgba(10, 15, 25, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            color: #ffcc00;
            font-weight: 600;
            backdrop-filter: blur(8px);
        }

        .top-right-controls {
            display: flex;
            gap: 12px;
        }

        .btn-neon {
            background: rgba(15, 12, 5, 0.8);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.2);
            backdrop-filter: blur(8px);
        }

        .btn-neon:hover {
            background: #ffaa00;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.6);
        }

        .prompt-title {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(10, 15, 25, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 10px 25px;
            border-radius: 25px;
            color: #8fa0be;
            font-style: italic;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            pointer-events: none;
        }

        .bottom-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 550px;
            background: rgba(8, 12, 20, 0.75);
            border: 1px solid rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
            border-radius: 30px;
            padding: 6px;
            display: flex;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .bottom-bar input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 20px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .bottom-bar input::placeholder { color: #6a7b95; }

        .btn-throw {
            background: linear-gradient(90deg, #ff9900, #ffbb00);
            border: none;
            color: #000;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.5);
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-throw:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.8);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #0d1322;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
            position: relative;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 12px; right: 18px;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #8fa0be; }
        .form-group input {
            width: 100%; padding: 10px; background: #050811;
            border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 8px; color: #fff; outline: none;
        }
        .form-group input:focus { border-color: #00f3ff; }

        .btn-submit-modal {
            width: 100%; padding: 12px;
            background: linear-gradient(90deg, #00f3ff, #0077ff);
            border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: #6a7b95;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: rgba(0, 243, 255, 0.2);
        }
        .divider span { padding: 0 10px; }

        .google-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="badge" id="wishCounter">✨ Wishes: 0</div>
        <div class="top-right-controls" id="authSection">
            <button class="btn-neon" onclick="openModal('login')">🔑 Login / Sign Up</button>
            <button class="btn-neon" style="border-color:#555; color:#aaa;">☀️ Day / 🌙 Night</button>
        </div>
    </div>

    <div class="prompt-title">Make your wish come true...</div>
    <div id="canvas-container"></div>

    <form class="bottom-bar" id="wishForm">
        <input type="text" id="wishInput" placeholder="Write a wish..." required>
        <button type="submit" class="btn-throw">Throw € (1€)</button>
    </form>

    <!-- Auth Modal -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" style="margin-bottom:20px; color:#00f3ff;">Login</h2>

            <!-- GOOGLE SIGN IN BUTTON -->
            <div class="google-btn-container">
                <div id="g_id_onload"
                    data-client_id="1093667690614-7pk8daqkqnfo4ei5rks0sqoesopsgjj0.apps.googleusercontent.com"
                    data-callback="handleGoogleCredentialResponse">
                </div>
                <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-shape="pill"></div>
            </div>

            <div class="divider"><span>OR</span></div>

            <form id="authForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-submit-modal" id="modalSubmitBtn">Login</button>
            </form>
            
            <p style="margin-top:15px; font-size:0.8rem; text-align:center; color:#8fa0be; cursor:pointer;" onclick="toggleAuthMode()" id="toggleAuthText">
                Don't have an account? Sign Up
            </p>
        </div>
    </div>

    <script>
        const API_URL = 'https://fountain-backend-mgxf.onrender.com/api';
        let authMode = 'login';
        let currentUser = JSON.parse(localStorage.getItem('user')) || null;

        // THREE.JS SCENE SETUP
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050508, 0.025);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 11);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        const cyanLight = new THREE.PointLight(0x00f3ff, 3, 15);
        cyanLight.position.set(0, 1, 0);
        scene.add(cyanLight);

        const darkMetal = new THREE.MeshStandardMaterial({ color: 0x222831, roughness: 0.4 });
        const glowingWater = new THREE.MeshStandardMaterial({ color: 0x00f3ff, transparent: true, opacity: 0.8, roughness: 0.1 });

        const base = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 4, 0.8, 32), darkMetal);
        base.position.y = -1;
        scene.add(base);

        const poolWater = new THREE.Mesh(new THREE.CylinderGeometry(3.3, 3.3, 0.6, 32), glowingWater);
        poolWater.position.y = -0.8;
        scene.add(poolWater);

        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 1.8, 16), darkMetal);
        pillar.position.y = 0.1;
        scene.add(pillar);

        const bowl = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.8, 0.3, 32), darkMetal);
        bowl.position.y = 1.0;
        scene.add(bowl);

        const bowlWater = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.2, 32), glowingWater);
        bowlWater.position.y = 1.1;
        scene.add(bowlWater);

        const pCount = 350;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3);
        const pVelo = [];

        for (let i = 0; i < pCount; i++) {
            pPos[i * 3] = (Math.random() - 0.5) * 0.2;
            pPos[i * 3 + 1] = 1.2;
            pPos[i * 3 + 2] = (Math.random() - 0.5) * 0.2;

            pVelo.push({
                x: (Math.random() - 0.5) * 0.04,
                y: Math.random() * 0.07 + 0.04,
                z: (Math.random() - 0.5) * 0.04
            });
        }

        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.9 });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        function animate() {
            requestAnimationFrame(animate);

            const pos = particles.geometry.attributes.position.array;
            for (let i = 0; i < pCount; i++) {
                pos[i * 3] += pVelo[i].x;
                pos[i * 3 + 1] += pVelo[i].y;
                pos[i * 3 + 2] += pVelo[i].z;
                pVelo[i].y -= 0.0025;

                if (pos[i * 3 + 1] < -0.6) {
                    pos[i * 3] = (Math.random() - 0.5) * 0.2;
                    pos[i * 3 + 1] = 1.2;
                    pos[i * 3 + 2] = (Math.random() - 0.5) * 0.2;
                    pVelo[i].y = Math.random() * 0.07 + 0.04;
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // AUTH & APP LOGIC
        updateAuthUI();
        loadWishes();

        function updateAuthUI() {
            const authSection = document.getElementById('authSection');
            if (currentUser) {
                authSection.innerHTML = `
                    <span style="color: #00f3ff; font-weight:600; align-self:center;">👤 ${currentUser.username}</span>
                    <button class="btn-neon" onclick="logout()" style="border-color:#ff4757; color:#ff4757;">Logout</button>
                `;
            } else {
                authSection.innerHTML = `
                    <button class="btn-neon" onclick="openModal('login')">🔑 Login / Sign Up</button>
                `;
            }
        }

        function openModal(mode) {
            authMode = mode;
            document.getElementById('modalTitle').innerText = mode === 'login' ? 'Login' : 'Sign Up';
            document.getElementById('modalSubmitBtn').innerText = mode === 'login' ? 'Login' : 'Sign Up';
            document.getElementById('toggleAuthText').innerText = mode === 'login' ? "Don't have an account? Sign Up" : "Already have an account? Login";
            document.getElementById('authModal').style.display = 'flex';
        }

        function toggleAuthMode() { openModal(authMode === 'login' ? 'signup' : 'login'); }
        function closeModal() { document.getElementById('authModal').style.display = 'none'; }

        // GOOGLE AUTH HANDLER
        async function handleGoogleCredentialResponse(response) {
            try {
                const res = await fetch(`${API_URL}/auth/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: response.credential })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Google Auth Failed');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                currentUser = data.user;

                updateAuthUI();
                closeModal();
                alert(`Welcome ${currentUser.username}!`);
            } catch (err) {
                alert(err.message);
            }
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const endpoint = authMode === 'login' ? '/auth/login' : '/auth/signup';

            try {
                const res = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Authentication failed');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                currentUser = data.user;

                updateAuthUI();
                closeModal();
                alert(`Welcome ${currentUser.username}!`);
            } catch (err) { alert(err.message); }
        });

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            currentUser = null;
            updateAuthUI();
        }

        async function loadWishes() {
            try {
                const res = await fetch(`${API_URL}/wishes`);
                const wishes = await res.json();
                if (Array.isArray(wishes)) {
                    document.getElementById('wishCounter').innerText = `✨ Wishes: ${wishes.length}`;
                }
            } catch (err) { console.log('Backend sync pending...'); }
        }

        document.getElementById('wishForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('wishInput').value;

            try {
                const wishRes = await fetch(`${API_URL}/wishes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, userId: currentUser ? currentUser.id : null })
                });

                if (!wishRes.ok) throw new Error('Failed to send wish');

                document.getElementById('wishInput').value = '';
                alert('✨ Your wish has been tossed into the fountain!');
                loadWishes();
            } catch (err) { alert('Error: ' + err.message); }
        });
    </script>
</body>
</html>

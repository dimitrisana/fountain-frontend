<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wish Fountain</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Three.js & Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Stripe SDK -->
    <script src="https://js.stripe.com/v3/"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #fff; overflow-x: hidden; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        .ui-overlay { position: relative; z-index: 10; pointer-events: none; padding: 20px; }
        .interactive { pointer-events: auto; }
        
        header { display: flex; justify: space-between; align-items: center; max-width: 1200px; margin: 0 auto 20px auto; }
        h1 { font-size: 1.8rem; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: linear-gradient(45deg, #3b82f6, #8b5cf6); color: white; }
        .btn-success { background: #22c55e; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        
        .card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; max-width: 500px; margin: 0 auto 30px auto; }
        textarea, input[type="text"], input[type="password"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 12px; }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: #1e293b; color: #94a3b8; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; }
        .tab-btn.active { background: #3b82f6; color: white; }

        .wishes-list { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .wish-item { background: rgba(30, 41, 59, 0.7); padding: 15px; border-radius: 8px; border-left: 4px solid #3b82f6; }
        
        .modal-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 100; display: none; justify-content: center; align-items: center; pointer-events: auto; }
        .modal { background: #1e293b; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <header class="interactive">
            <h1>✨ Wish Fountain</h1>
            <div id="user-controls">
                <button class="btn btn-primary" onclick="openModal('auth-modal')">Σύνδεση / Εγγραφή</button>
            </div>
        </header>

        <!-- Φόρμα Ευχής -->
        <div class="card interactive">
            <h2 style="margin-bottom: 15px; font-size: 1.2rem;">Ρίξε ένα νόμισμα & Κάνε μια ευχή 🪙</h2>
            <form id="wish-form">
                <textarea id="wish-text" placeholder="Πρέπει να συνδεθείτε για να κάνετε ευχή..." rows="3" required disabled></textarea>
                <div style="margin-bottom: 15px;">
                    <label style="cursor: pointer;">
                        <input type="checkbox" id="wish-public" checked disabled> Δημόσια ευχή
                    </label>
                </div>
                <button type="submit" id="submit-wish-btn" class="btn btn-primary" style="width: 100%;" disabled>Σύνδεση για Ευχή</button>
            </form>
        </div>

        <!-- Tabs Navigation -->
        <div class="tabs interactive">
            <button class="tab-btn active" id="tab-all" onclick="switchTab('all')">Όλες οι Ευχές</button>
            <button class="tab-btn" id="tab-my" onclick="switchTab('my')" style="display: none;">Οι Ευχές Μου</button>
        </div>

        <!-- Λίστα Ευχών -->
        <div class="wishes-list interactive" id="wishes-container"></div>
    </div>

    <!-- Modal Auth -->
    <div class="modal-bg" id="auth-modal">
        <div class="modal">
            <h2 id="auth-title" style="margin-bottom: 15px;">Σύνδεση</h2>
            <p id="auth-error" style="color: #ef4444; font-size: 0.9rem; margin-bottom: 10px; display: none;"></p>
            <form id="auth-form">
                <input type="text" id="auth-username" placeholder="Όνομα χρήστη" required>
                <input type="password" id="auth-password" placeholder="Κωδικός πρόσβασης" required>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 10px;">Είσοδος</button>
            </form>
            <button class="btn" style="background: transparent; color: #94a3b8; width: 100%;" onclick="toggleAuthMode()">Δεν έχετε λογαριασμό; Εγγραφείτε</button>
            <button class="btn btn-danger" style="width: 100%; margin-top: 10px;" onclick="closeModal('auth-modal')">Ακύρωση</button>
        </div>
    </div>

    <!-- Modal Edit Wish -->
    <div class="modal-bg" id="edit-modal">
        <div class="modal">
            <h2 style="margin-bottom: 15px;">Επεξεργασία Ευχής</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-wish-id">
                <textarea id="edit-wish-text" rows="3" required></textarea>
                <div style="margin-bottom: 15px;">
                    <label style="cursor: pointer;">
                        <input type="checkbox" id="edit-wish-public"> Δημόσια ευχή
                    </label>
                </div>
                <button type="submit" class="btn btn-success" style="width: 100%; margin-bottom: 10px;">Αποθήκευση</button>
                <button type="button" class="btn btn-danger" style="width: 100%;" onclick="closeModal('edit-modal')">Ακύρωση</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://fountain-backend-k864.onrender.com';
        const stripe = Stripe('pk_test_51RoF1fJiXuGDcV5COMHcZGoKAVl1sAGmnbOr4QjZeAmGE34h40jgZuiCHdfmh7RACRYBRA2XjgWwwQH7TkshuUR001cdXMc90');

        let token = localStorage.getItem('token') || '';
        let user = JSON.parse(localStorage.getItem('user') || 'null');
        let currentTab = 'all';
        let isLoginView = true;

        // UI Initialization
        function updateUI() {
            const userControls = document.getElementById('user-controls');
            const wishText = document.getElementById('wish-text');
            const wishPublic = document.getElementById('wish-public');
            const submitBtn = document.getElementById('submit-wish-btn');
            const tabMy = document.getElementById('tab-my');

            if (user && token) {
                userControls.innerHTML = `<span>Καλώς ήρθες, <strong>${user.username}</strong></span> <button class="btn btn-danger" onclick="logout()" style="margin-left: 10px; padding: 5px 10px;">Έξοδος</button>`;
                wishText.disabled = false;
                wishText.placeholder = "Γράψε την ευχή σου...";
                wishPublic.disabled = false;
                submitBtn.disabled = false;
                submitBtn.innerText = "Πληρωμή (1.00 €) & Δημοσίευση";
                tabMy.style.display = 'inline-block';
            } else {
                userControls.innerHTML = `<button class="btn btn-primary" onclick="openModal('auth-modal')">Σύνδεση / Εγγραφή</button>`;
                wishText.disabled = true;
                wishText.placeholder = "Πρέπει να συνδεθείτε για να κάνετε ευχή...";
                wishPublic.disabled = true;
                submitBtn.disabled = false;
                submitBtn.innerText = "Σύνδεση για Ευχή";
                tabMy.style.display = 'none';
                switchTab('all');
            }
        }

        // Fetch Wishes
        async function fetchWishes() {
            const container = document.getElementById('wishes-container');
            container.innerHTML = '<p>Φόρτωση ευχών...</p>';

            try {
                let url = `${API_BASE_URL}/api/wishes`;
                let headers = {};

                if (currentTab === 'my') {
                    url = `${API_BASE_URL}/api/wishes/my-wishes`;
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const res = await fetch(url, { headers });
                const wishes = await res.json();

                container.innerHTML = '';
                if (!Array.isArray(wishes) || wishes.length === 0) {
                    container.innerHTML = '<p>Δεν βρέθηκαν ευχές.</p>';
                    return;
                }

                wishes.forEach(w => {
                    const item = document.createElement('div');
                    item.className = 'wish-item';
                    item.innerHTML = `
                        <p style="font-weight: 600;">"${w.text}"</p>
                        <small style="color: #94a3b8;">Από: ${w.author} | ${new Date(w.createdAt).toLocaleDateString()}</small>
                        ${currentTab === 'my' ? `<br><button class="btn btn-primary" style="padding: 4px 8px; font-size: 0.8rem; margin-top: 8px;" onclick="openEditModal('${w._id}', '${w.text.replace(/'/g, "\\'")}', ${w.isPublic})">Επεξεργασία</button>` : ''}
                    `;
                    container.appendChild(item);
                });
            } catch (err) {
                container.innerHTML = '<p>Σφάλμα φόρτωσης ευχών.</p>';
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-all').classList.toggle('active', tab === 'all');
            document.getElementById('tab-my').classList.toggle('active', tab === 'my');
            fetchWishes();
        }

        // Wish Submission
        document.getElementById('wish-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!user || !token) {
                openModal('auth-modal');
                return;
            }

            const wishText = document.getElementById('wish-text').value;
            const isPublic = document.getElementById('wish-public').checked;

            try {
                const res = await fetch(`${API_BASE_URL}/api/create-checkout-session`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ wishText, isPublic })
                });

                const data = await res.json();
                if (data.id) {
                    await stripe.redirectToCheckout({ sessionId: data.id });
                } else {
                    alert(data.message || 'Σφάλμα πληρωμής.');
                }
            } catch (err) {
                alert('Σφάλμα σύνδεσης.');
            }
        });

        // Auth Logic
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('auth-username').value;
            const password = document.getElementById('auth-password').value;
            const errorEl = document.getElementById('auth-error');
            errorEl.style.display = 'none';

            const endpoint = isLoginView ? '/api/auth/login' : '/api/auth/signup';

            try {
                const res = await fetch(`${API_BASE_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    errorEl.innerText = data.message || 'Αποτυχία αυθεντικοποίησης.';
                    errorEl.style.display = 'block';
                    return;
                }

                token = data.token;
                user = data.user;
                localStorage.setItem('token', token);
                localStorage.setItem('user', JSON.stringify(user));

                closeModal('auth-modal');
                updateUI();
                fetchWishes();
            } catch (err) {
                errorEl.innerText = 'Σφάλμα διακομιστή.';
                errorEl.style.display = 'block';
            }
        });

        function toggleAuthMode() {
            isLoginView = !isLoginView;
            document.getElementById('auth-title').innerText = isLoginView ? 'Σύνδεση' : 'Εγγραφή';
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            token = '';
            user = null;
            updateUI();
            fetchWishes();
        }

        // Edit Modal Logic
        function openEditModal(id, text, isPublic) {
            document.getElementById('edit-wish-id').value = id;
            document.getElementById('edit-wish-text').value = text;
            document.getElementById('edit-wish-public').checked = isPublic;
            openModal('edit-modal');
        }

        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-wish-id').value;
            const text = document.getElementById('edit-wish-text').value;
            const isPublic = document.getElementById('edit-wish-public').checked;

            try {
                const res = await fetch(`${API_BASE_URL}/api/wishes/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ text, isPublic })
                });

                if (res.ok) {
                    closeModal('edit-modal');
                    fetchWishes();
                } else {
                    alert('Αποτυχία ενημέρωσης.');
                }
            } catch (err) {
                alert('Σφάλμα σύνδεσης.');
            }
        });

        // Modal Controls
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Init Three.js Background Simulation
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const geometry = new THREE.TorusGeometry(10, 3, 16, 100);
        const material = new THREE.MeshBasicMaterial({ color: 0x3b82f6, wireframe: true });
        const torus = new THREE.Mesh(geometry, material);
        scene.add(torus);
        camera.position.z = 30;

        function animate() {
            requestAnimationFrame(animate);
            torus.rotation.x += 0.01;
            torus.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        // Initial Load
        updateUI();
        fetchWishes();
    </script>
</body>
</html>

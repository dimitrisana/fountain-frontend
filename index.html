<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Wishing Fountain</title>
    <!-- Three.js & Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Google Auth SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            background-color: #050508;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .top-bar {
            position: absolute;
            top: 20px;
            width: 100%;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .badge {
            background: rgba(10, 15, 25, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            color: #ffcc00;
            font-weight: 600;
            backdrop-filter: blur(8px);
        }

        .top-right-controls {
            display: flex;
            gap: 12px;
        }

        .btn-neon {
            background: rgba(15, 12, 5, 0.8);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.2);
            backdrop-filter: blur(8px);
        }

        .btn-neon:hover {
            background: #ffaa00;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.6);
        }

        .prompt-title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(10, 15, 25, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 8px 22px;
            border-radius: 25px;
            color: #8fa0be;
            font-style: italic;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            pointer-events: none;
            font-size: 0.95rem;
        }

        .bottom-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 550px;
            background: rgba(8, 12, 20, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
            border-radius: 30px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .bottom-bar input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 15px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .bottom-bar input::placeholder { color: #6a7b95; }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            color: #00f3ff;
            margin: 0 10px;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-throw {
            background: linear-gradient(90deg, #ff9900, #ffbb00);
            border: none;
            color: #000;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.5);
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-throw:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.8);
        }

        /* 3D COIN TOOLTIP POPUP */
        #coinTooltip {
            position: absolute;
            display: none;
            background: rgba(10, 15, 28, 0.95);
            border: 1px solid #00f3ff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            padding: 12px 16px;
            border-radius: 12px;
            color: #fff;
            z-index: 50;
            pointer-events: auto;
            max-width: 260px;
            backdrop-filter: blur(8px);
            transform: translate(-50%, -100%);
        }

        #coinTooltip .wish-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        #coinTooltip .wish-author {
            font-size: 0.75rem;
            color: #8fa0be;
            margin-bottom: 8px;
        }

        #coinTooltip .actions {
            display: flex;
            gap: 6px;
        }

        .tooltip-btn {
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .tooltip-btn.delete {
            border-color: #ff4757;
            color: #ff4757;
            background: rgba(255, 71, 87, 0.15);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #0d1322;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
            position: relative;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 12px; right: 18px;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #8fa0be; }
        .form-group input {
            width: 100%; padding: 10px; background: #050811;
            border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 8px; color: #fff; outline: none;
        }
        .form-group input:focus { border-color: #00f3ff; }

        .btn-submit-modal {
            width: 100%; padding: 12px;
            background: linear-gradient(90deg, #00f3ff, #0077ff);
            border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: #6a7b95;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: rgba(0, 243, 255, 0.2);
        }
        .divider span { padding: 0 10px; }

        .google-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="badge" id="wishCounter">✨ Wishes: 0</div>
        <div class="top-right-controls" id="authSection"></div>
    </div>

    <div class="prompt-title">Make your wish come true... ✨</div>
    <div id="canvas-container"></div>

    <!-- COIN TOOLTIP POPUP -->
    <div id="coinTooltip">
        <div class="wish-text" id="ttText">Wish text...</div>
        <div class="wish-author" id="ttAuthor">By: Anonymous</div>
        <div class="actions" id="ttActions"></div>
    </div>

    <form class="bottom-bar" id="wishForm">
        <input type="text" id="wishInput" placeholder="Make a wish..." required>
        
        <label class="checkbox-container">
            <input type="checkbox" id="isPublicCheckbox" checked> Public
        </label>

        <button type="submit" class="btn-throw" id="submitWishBtn">Throw € (1€)</button>
    </form>

    <!-- Auth Modal -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h2 id="modalTitle" style="margin-bottom:20px; color:#00f3ff;">Login</h2>

            <!-- GOOGLE SIGN IN BUTTON -->
            <div class="google-btn-container">
                <div id="g_id_onload"
                    data-client_id="1093667690614-7pk8daqkqnfo4ei5rks0sqoesopsgjj0.apps.googleusercontent.com"
                    data-callback="handleGoogleCredentialResponse">
                </div>
                <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-shape="pill"></div>
            </div>

            <div class="divider"><span>OR</span></div>

            <form id="authForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-submit-modal" id="modalSubmitBtn">Login</button>
            </form>
            
            <p style="margin-top:15px; font-size:0.8rem; text-align:center; color:#8fa0be; cursor:pointer;" id="toggleAuthText">
                Don't have an account? Sign Up
            </p>
        </div>
    </div>

    <script>
        const API_URL = 'https://fountain-backend-mgxf.onrender.com/api';
        let authMode = 'login';
        let currentUser = JSON.parse(localStorage.getItem('user')) || null;
        let wishCoins = []; // Array of { mesh, data }
        let coinMeshes = []; // Cached meshes for fast raycasting
        let activeCoinObj = null; // Currently hovered coin

        // THREE.JS SCENE SETUP
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050508, 0.025);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 11);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        // Light for bottom pool
        const cyanLight = new THREE.PointLight(0x00f3ff, 3, 15);
        cyanLight.position.set(0, 0.2, 0);
        scene.add(cyanLight);

        // Dedicated light for top bowl water
        const cyanLightTop = new THREE.PointLight(0x00f3ff, 2.5, 8);
        cyanLightTop.position.set(0, 1.8, 0);
        scene.add(cyanLightTop);

        const goldLight = new THREE.PointLight(0xffaa00, 2, 10);
        goldLight.position.set(0, -0.2, 0);
        scene.add(goldLight);

        const darkMetal = new THREE.MeshStandardMaterial({ color: 0x222831, roughness: 0.4 });
        const glowingWater = new THREE.MeshStandardMaterial({ color: 0x00f3ff, transparent: true, opacity: 0.85, roughness: 0.1 });
        const goldMaterial = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.8, roughness: 0.2 });

        const base = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 4, 0.8, 32), darkMetal);
        base.position.y = -1;
        scene.add(base);

        const poolWater = new THREE.Mesh(new THREE.CylinderGeometry(3.3, 3.3, 0.6, 32), glowingWater);
        poolWater.position.y = -0.8;
        scene.add(poolWater);

        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 1.8, 16), darkMetal);
        pillar.position.y = 0.1;
        scene.add(pillar);

        const bowl = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.8, 0.3, 32), darkMetal);
        bowl.position.y = 1.0;
        scene.add(bowl);

        // Top bowl water using exact glowing material & position
        const bowlWater = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.2, 32), glowingWater);
        bowlWater.position.y = 1.1;
        scene.add(bowlWater);

        // WATER PARTICLES
        const pCount = 350;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3);
        const pVelo = [];

        for (let i = 0; i < pCount; i++) {
            pPos[i * 3] = (Math.random() - 0.5) * 0.2;
            pPos[i * 3 + 1] = 1.2;
            pPos[i * 3 + 2] = (Math.random() - 0.5) * 0.2;

            pVelo.push({
                x: (Math.random() - 0.5) * 0.04,
                y: Math.random() * 0.07 + 0.04,
                z: (Math.random() - 0.5) * 0.04
            });
        }

        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.9 });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        // RAYCASTER FOR COIN HOVER / CLICK
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('coinTooltip');

        window.addEventListener('mousemove', onPointerMove);

        function onPointerMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            if (coinMeshes.length === 0) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(coinMeshes);

            if (intersects.length > 0) {
                const hitCoin = wishCoins.find(c => c.mesh === intersects[0].object);
                if (hitCoin) {
                    activeCoinObj = hitCoin;
                    showTooltip(hitCoin);
                    document.body.style.cursor = 'pointer';
                    return;
                }
            }

            if (!tooltip.contains(event.target)) {
                hideTooltip();
                document.body.style.cursor = 'default';
            }
        }

        function showTooltip(coinObj) {
            const selectedWish = coinObj.data;
            document.getElementById('ttText').innerText = selectedWish.text;
            document.getElementById('ttAuthor').innerText = `By: ${selectedWish.username || 'Anonymous'} ${selectedWish.isFulfilled ? '• ✨ Fulfilled' : ''}`;

            const isOwner = currentUser && (selectedWish.username === currentUser.username || selectedWish.userId === currentUser.id);
            const actionsDiv = document.getElementById('ttActions');
            actionsDiv.innerHTML = '';

            if (isOwner) {
                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'tooltip-btn';
                toggleBtn.innerText = selectedWish.isFulfilled ? '⏳ Reset' : '✨ Fulfill';
                toggleBtn.onclick = () => toggleFulfilled(selectedWish._id, selectedWish.isFulfilled);

                const delBtn = document.createElement('button');
                delBtn.className = 'tooltip-btn delete';
                delBtn.innerText = '🗑️ Delete';
                delBtn.onclick = () => deleteWish(selectedWish._id);

                actionsDiv.appendChild(toggleBtn);
                actionsDiv.appendChild(delBtn);
            }

            updateTooltipPosition();
            tooltip.style.display = 'block';
        }

        function updateTooltipPosition() {
            if (!activeCoinObj || tooltip.style.display !== 'block') return;
            
            const coinPos = activeCoinObj.mesh.position.clone();
            coinPos.project(camera);
            
            if (coinPos.z > 1) {
                tooltip.style.display = 'none';
                return;
            }

            const x = (coinPos.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(coinPos.y * 0.5) + 0.5) * window.innerHeight;

            tooltip.style.left = `${x}px`;
            tooltip.style.top = `${y - 15}px`;
        }

        function hideTooltip() {
            activeCoinObj = null;
            tooltip.style.display = 'none';
        }

        function animate() {
            requestAnimationFrame(animate);

            const pos = particles.geometry.attributes.position.array;
            for (let i = 0; i < pCount; i++) {
                pos[i * 3] += pVelo[i].x;
                pos[i * 3 + 1] += pVelo[i].y;
                pos[i * 3 + 2] += pVelo[i].z;
                pVelo[i].y -= 0.0025;

                if (pos[i * 3 + 1] < -0.6) {
                    pos[i * 3] = (Math.random() - 0.5) * 0.2;
                    pos[i * 3 + 1] = 1.2;
                    pos[i * 3 + 2] = (Math.random() - 0.5) * 0.2;
                    pVelo[i].y = Math.random() * 0.07 + 0.04;
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;

            wishCoins.forEach(c => {
                c.mesh.rotation.y += 0.01;
            });

            controls.update();
            updateTooltipPosition();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- AUDIO FX (Synthesized Splash / Coin Sound) ---
        function playSplashSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Coin metallic chime
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(987.77, audioCtx.currentTime); // B5 note
                osc1.frequency.exponentialRampToValueAtTime(1318.51, audioCtx.currentTime + 0.1); // E6 note
                gain1.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start();
                osc1.stop(audioCtx.currentTime + 0.4);

                // Water splash noise
                const bufferSize = audioCtx.sampleRate * 0.3;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1200;
                const gain2 = audioCtx.createGain();
                gain2.gain.setValueAtTime(0.2, audioCtx.currentTime + 0.05);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                noise.connect(filter);
                filter.connect(gain2);
                gain2.connect(audioCtx.destination);
                noise.start(audioCtx.currentTime + 0.05);
            } catch(e) {
                console.log('Audio playback waiting for interaction');
            }
        }

        // --- WATER RIPPLE EFFECT ---
        function createWaterRipple(x, z) {
            const rippleGeo = new THREE.RingGeometry(0.05, 0.15, 32);
            const rippleMat = new THREE.MeshBasicMaterial({
                color: 0x00f3ff,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.9
            });
            const ripple = new THREE.Mesh(rippleGeo, rippleMat);
            ripple.rotation.x = Math.PI / 2;
            ripple.position.set(x, -0.79, z);
            scene.add(ripple);

            let scale = 1;
            let opacity = 0.9;

            function animateRipple() {
                scale += 0.08;
                opacity -= 0.03;
                ripple.scale.set(scale, scale, 1);
                ripple.material.opacity = opacity;

                if (opacity > 0) {
                    requestAnimationFrame(animateRipple);
                } else {
                    scene.remove(ripple);
                    ripple.geometry.dispose();
                    ripple.material.dispose();
                }
            }
            animateRipple();
        }

        // --- COIN TOSS ANIMATION ---
        function animateCoinDrop(callback) {
            const startPos = new THREE.Vector3((Math.random() - 0.5) * 4, 6, 3);
            const targetAngle = Math.random() * Math.PI * 2;
            const targetRadius = 0.5 + Math.random() * 2.0;
            const targetPos = new THREE.Vector3(
                Math.cos(targetAngle) * targetRadius,
                -0.8,
                Math.sin(targetAngle) * targetRadius
            );

            const tossCoinGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.04, 16);
            const tossCoinMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.9, roughness: 0.1 });
            const tossCoin = new THREE.Mesh(tossCoinGeo, tossCoinMat);
            tossCoin.position.copy(startPos);
            scene.add(tossCoin);

            let progress = 0;
            const duration = 120; // ~2 seconds

            function updateToss() {
                progress++;
                const t = progress / duration;

                tossCoin.position.x = THREE.MathUtils.lerp(startPos.x, targetPos.x, t);
                tossCoin.position.z = THREE.MathUtils.lerp(startPos.z, targetPos.z, t);
                
                const heightArc = Math.sin(t * Math.PI) * 2; 
                tossCoin.position.y = THREE.MathUtils.lerp(startPos.y, targetPos.y, t) + heightArc;

                tossCoin.rotation.x += 0.25;
                tossCoin.rotation.y += 0.2;

                if (t < 1) {
                    requestAnimationFrame(updateToss);
                } else {
                    scene.remove(tossCoin);
                    tossCoin.geometry.dispose();
                    tossCoin.material.dispose();
                    
                    playSplashSound();
                    createWaterRipple(targetPos.x, targetPos.z);
                    if (callback) callback();
                }
            }
            updateToss();
        }

        // EVENT LISTENERS UI
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('toggleAuthText').addEventListener('click', toggleAuthMode);

        // CHECK FOR PAYMENT STATUS ON PAGE LOAD
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('payment') === 'success') {
                window.history.replaceState({}, document.title, window.location.pathname);
                
                setTimeout(() => {
                    animateCoinDrop(() => {
                        loadWishes();
                    });
                }, 500);
            } else if (urlParams.get('payment') === 'cancel') {
                alert('❌ Payment was cancelled.');
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });

        // AUTH & APP LOGIC
        updateAuthUI();
        loadWishes();

        function updateAuthUI() {
            const authSection = document.getElementById('authSection');
            authSection.innerHTML = '';

            if (currentUser) {
                const userSpan = document.createElement('span');
                userSpan.style.cssText = 'color: #00f3ff; font-weight:600; align-self:center;';
                userSpan.innerText = `👤 ${currentUser.username}`;

                const logoutBtn = document.createElement('button');
                logoutBtn.className = 'btn-neon';
                logoutBtn.style.cssText = 'border-color:#ff4757; color:#ff4757;';
                logoutBtn.innerText = 'Logout';
                logoutBtn.onclick = logout;

                authSection.appendChild(userSpan);
                authSection.appendChild(logoutBtn);
            } else {
                const loginBtn = document.createElement('button');
                loginBtn.className = 'btn-neon';
                loginBtn.innerText = '🔑 Login / Sign Up';
                loginBtn.onclick = () => openModal('login');

                authSection.appendChild(loginBtn);
            }
        }

        function openModal(mode) {
            authMode = mode;
            document.getElementById('modalTitle').innerText = mode === 'login' ? 'Login' : 'Sign Up';
            document.getElementById('modalSubmitBtn').innerText = mode === 'login' ? 'Login' : 'Sign Up';
            document.getElementById('toggleAuthText').innerText = mode === 'login' ? "Don't have an account? Sign Up" : "Already have an account? Login";
            document.getElementById('authModal').style.display = 'flex';
        }

        function toggleAuthMode() { openModal(authMode === 'login' ? 'signup' : 'login'); }
        function closeModal() { document.getElementById('authModal').style.display = 'none'; }

        // GOOGLE AUTH HANDLER
        async function handleGoogleCredentialResponse(response) {
            try {
                const res = await fetch(`${API_URL}/auth/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: response.credential })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Google Auth Failed');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                currentUser = data.user;

                updateAuthUI();
                closeModal();
                loadWishes();
                alert(`Welcome ${currentUser.username}!`);
            } catch (err) {
                alert(err.message);
            }
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const endpoint = authMode === 'login' ? '/auth/login' : '/auth/signup';

            try {
                const res = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Authentication failed');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                currentUser = data.user;

                updateAuthUI();
                closeModal();
                loadWishes();
                alert(`Welcome ${currentUser.username}!`);
            } catch (err) { alert(err.message); }
        });

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            currentUser = null;
            updateAuthUI();
            loadWishes();
        }

        // LOAD WISHES AND CREATE 3D COINS
        async function loadWishes() {
            try {
                const res = await fetch(`${API_URL}/wishes`);
                const wishes = await res.json();
                if (Array.isArray(wishes)) {
                    document.getElementById('wishCounter').innerText = `✨ Wishes: ${wishes.length}`;
                    spawn3DCoins(wishes.slice(-1500));
                }
            } catch (err) { console.log('Waiting for backend connection...'); }
        }

        function spawn3DCoins(wishes) {
            wishCoins.forEach(c => scene.remove(c.mesh));
            wishCoins = [];
            coinMeshes = [];

            const coinGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.04, 8);

            wishes.forEach((wish) => {
                const angle = Math.random() * Math.PI * 2;
                const radius = 0.5 + Math.random() * 2.2; 
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                const y = -0.52 + (Math.random() * 0.05);

                const mat = wish.isFulfilled 
                    ? new THREE.MeshStandardMaterial({ color: 0x00ff88, metalness: 0.9, roughness: 0.1 })
                    : goldMaterial;

                const coinMesh = new THREE.Mesh(coinGeo, mat);
                coinMesh.position.set(x, y, z);
                coinMesh.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.4;
                coinMesh.rotation.z = Math.random() * Math.PI;

                scene.add(coinMesh);
                wishCoins.push({ mesh: coinMesh, data: wish });
                coinMeshes.push(coinMesh);
            });
        }

        // SUBMIT WISH VIA STRIPE CHECKOUT SESSION
        document.getElementById('wishForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('wishInput').value;
            const isPublic = document.getElementById('isPublicCheckbox').checked;
            const token = localStorage.getItem('token');
            const submitBtn = document.getElementById('submitWishBtn');

            try {
                submitBtn.innerText = 'Redirecting...';
                submitBtn.disabled = true;

                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const response = await fetch(`${API_URL}/wishes/create-checkout-session`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        text,
                        isPublic,
                        color: '#00f3ff',
                        username: currentUser ? currentUser.username : 'Anonymous',
                        userId: currentUser ? currentUser.id : ''
                    })
                });

                const data = await response.json();

                if (response.ok && data.url) {
                    window.location.href = data.url;
                } else {
                    alert(data.message || 'Αποτυχία δημιουργίας συνεδρίας πληρωμής.');
                    submitBtn.innerText = 'Throw € (1€)';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert('Σφάλμα κατά τη σύνδεση με τον διακομιστή.');
                submitBtn.innerText = 'Throw € (1€)';
                submitBtn.disabled = false;
            }
        });

        // TOGGLE FULFILLED & DELETE WISH ACTIONS
        async function toggleFulfilled(wishId, currentStatus) {
            const token = localStorage.getItem('token');
            if (!token) return alert('Πρέπει να συνδεθείτε!');

            try {
                const res = await fetch(`${API_URL}/wishes/${wishId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ isFulfilled: !currentStatus })
                });

                if (res.ok) {
                    hideTooltip();
                    loadWishes();
                } else {
                    const errData = await res.json();
                    alert(errData.message || 'Αποτυχία ενημέρωσης.');
                }
            } catch (err) {
                alert('Σφάλμα κατά την ενημέρωση της ευχής.');
            }
        }

        async function deleteWish(wishId) {
            if (!confirm('Είστε σίγουροι ότι θέλετε να διαγράψετε αυτή την ευχή;')) return;
            const token = localStorage.getItem('token');
            if (!token) return alert('Πρέπει να συνδεθείτε!');

            try {
                const res = await fetch(`${API_URL}/wishes/${wishId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (res.ok) {
                    hideTooltip();
                    loadWishes();
                } else {
                    const errData = await res.json();
                    alert(errData.message || 'Αποτυχία διαγραφής.');
                }
            } catch (err) {
                alert('Σφάλμα κατά τη διαγραφή της ευχής.');
            }
        }
    </script>
